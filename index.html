<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trilha — Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #F1EFE6;
    --surface: #FFFFFF;
    --ink: #20261F;
    --muted: #6B7570;
    --border: #E4E0D4;
    --primary: #24504B;
    --primary-light: #DCEAE6;
    --accent: #D98E2B;
    --accent-light: #F7E6C9;
    --novo: #D98E2B;
    --em-conversa: #24504B;
    --convertido: #3E7A4E;
    --perdido: #A15A45;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    height: 100vh;
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .sidebar.hide-mobile { display: none; }
    .conversation.hide-mobile { display: none; }
  }

  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .sidebar-header {
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 2px;
    color: var(--primary);
  }
  .brand-sub {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 14px;
  }
  .search {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
  }
  .search:focus { border-color: var(--primary); }

  .filters {
    display: flex;
    gap: 6px;
    padding: 12px 20px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
  }
  .filter-pill {
    font-size: 11.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .filter-pill.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  /* Menu lateral */
  .nav-menu {
    flex: 1;
    padding: 8px 12px;
    overflow-y: auto;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--muted);
    margin-bottom: 3px;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .nav-item .nav-icon { font-size: 15px; width: 18px; text-align: center; }
  .nav-item.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 500;
  }
  .nav-item:hover:not(.active) { background: var(--bg); }
  .nav-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }

  /* Área principal (relatório / visão geral / conversa) */
  .main-toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .main-toolbar .search { max-width: 320px; }
  .main-body {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }

  .report-table-wrap { overflow-x: auto; }
  .report-table {
    width: 100%;
    border-collapse: collapse;
  }
  .report-table th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    padding: 12px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
  }
  .report-row {
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .report-row:hover { background: var(--surface); }
  .report-table td {
    padding: 13px 28px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    vertical-align: middle;
  }
  .report-name-cell {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Fraunces', serif;
    font-weight: 500;
  }
  .report-phone-cell {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
  }
  .report-date-cell {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .status-pill-small {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    color: white;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    white-space: nowrap;
  }
  .notes-input {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    color: var(--ink);
    padding: 5px 8px;
    border-radius: 6px;
    outline: none;
  }
  .notes-input:hover { background: var(--bg); }
  .notes-input:focus { background: var(--bg); border-color: var(--primary); }
  .notes-input::placeholder { color: var(--muted); }

  .contact-list {
    flex: 1;
    overflow-y: auto;
  }
  .contact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 20px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    position: relative;
    transition: background 0.12s ease;
  }
  .contact-row:hover { background: var(--bg); }
  .contact-row.selected { background: var(--primary-light); }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    flex-shrink: 0;
  }
  .contact-info { min-width: 0; flex: 1; }
  .contact-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .contact-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .contact-time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .contact-preview {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--novo);
    flex-shrink: 0;
    box-shadow: 0 0 0 0 rgba(217, 142, 43, 0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(217, 142, 43, 0.5); }
    70%  { box-shadow: 0 0 0 7px rgba(217, 142, 43, 0); }
    100% { box-shadow: 0 0 0 0 rgba(217, 142, 43, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse-dot { animation: none; }
  }

  .empty-list {
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  /* Conversation panel */
  .conversation {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--bg);
  }
  .conv-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .conv-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .conv-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    margin: 0;
  }
  .conv-phone {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin: 2px 0 0;
  }
  .back-btn {
    display: none;
    border: none;
    background: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--primary);
    padding: 0 4px;
  }
  @media (max-width: 760px) {
    .back-btn { display: block; }
  }

  .field-select {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    padding: 6px 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text, inherit);
    cursor: pointer;
    outline: none;
    max-width: 150px;
  }
  .status-select {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    cursor: pointer;
    outline: none;
    color: white;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 62%;
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.5;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .bubble.me {
    align-self: flex-end;
    background: color-mix(in srgb, var(--primary) 12%, var(--surface));
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 4px;
  }
  .bubble-time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
  }
  .bubble-audio {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .bubble-audio audio { height: 32px; max-width: 220px; }

  .close-btn {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    padding: 6px 8px;
    border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .close-btn:hover {
    background: var(--bg);
    color: var(--ink);
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .overview {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    padding: 32px 40px;
    gap: 32px;
  }
  .overview-title {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    color: var(--muted);
    margin: 0;
    text-align: center;
  }
  .overview-grid {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(130px, 1fr);
    gap: 14px;
    align-items: start;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .stat-cell {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    min-width: 130px;
    border-top: 3px solid var(--stat-color, var(--primary));
  }
  .stat-number {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1;
    color: var(--ink);
  }
  .stat-label {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 6px;
  }
  .status-expand {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .status-expand-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 13px;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .status-expand-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }
  .status-expand-row:last-child { border-bottom: none; }

  .timeline {
    width: 100%;
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
  }
  .timeline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .timeline-breadcrumb {
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .timeline-crumb {
    cursor: pointer;
    color: var(--primary);
    font-weight: 500;
  }
  .timeline-crumb:hover { text-decoration: underline; }
  .timeline-crumb.current {
    color: var(--ink);
    cursor: default;
    text-decoration: none;
    font-family: 'Fraunces', serif;
  }
  .timeline-hint {
    font-size: 11px;
    color: var(--muted);
  }
  .timeline-selects {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .timeline-select {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
    outline: none;
  }
  .timeline-select:focus { border-color: var(--primary); }
  .timeline-bars {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 120px;
  }
  .timeline-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    cursor: pointer;
    min-width: 0;
  }
  .timeline-bar-wrap.not-clickable { cursor: default; }
  .timeline-bar-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .timeline-bar {
    width: 100%;
    max-width: 34px;
    background: var(--primary);
    border-radius: 4px 4px 0 0;
    min-height: 3px;
    transition: opacity 0.15s ease;
  }
  .timeline-bar-wrap:not(.not-clickable):hover .timeline-bar { opacity: 0.75; }
  .timeline-bar-label {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 6px;
    white-space: nowrap;
  }
  .timeline-empty {
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    padding: 30px 0;
  }
  .wordcloud {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    justify-content: center;
    padding: 8px 4px 4px;
  }
  .wc-word {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    line-height: 1;
    cursor: default;
    display: inline-block;
  }

  .login-screen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 32px;
    width: 100%;
    max-width: 340px;
  }
  .login-brand {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--primary);
    margin: 0 0 4px;
    text-align: center;
  }
  .login-sub {
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
    margin: 0 0 24px;
  }
  .login-field { margin-bottom: 14px; }
  .login-label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .login-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
  }
  .login-input:focus { border-color: var(--primary); }
  .login-btn {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: white;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 6px;
  }
  .login-btn:disabled { opacity: 0.6; cursor: default; }
  .login-error {
    color: var(--perdido);
    font-size: 12px;
    margin-top: 10px;
    text-align: center;
  }
  .logout-btn {
    font-size: 11.5px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }

  .zapi-connect {
    max-width: 460px;
    margin: 0 auto;
    padding: 32px 24px;
  }
  .zapi-field { margin-bottom: 14px; }
  .zapi-qr-box {
    text-align: center;
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-top: 20px;
  }
  .zapi-qr-box img {
    width: 220px;
    height: 220px;
    border-radius: 8px;
  }
  .zapi-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .zapi-status-badge.connected { background: var(--primary-light); color: var(--primary); }
  .zapi-status-badge.pending { background: var(--accent-light); color: var(--accent); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(32, 38, 31, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    margin: 0 0 18px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .modal-btn-secondary {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    cursor: pointer;
  }
  .modal-btn-primary {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: white;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .modal-btn-primary:disabled { opacity: 0.6; cursor: default; }
  .modal-textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
    resize: vertical;
    min-height: 70px;
  }
  .modal-textarea:focus { border-color: var(--primary); }
  .add-contact-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: white;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }

  .admin-panel { max-width: 720px; margin: 0 auto; padding: 28px 24px; }
  .admin-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .admin-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .admin-row:last-child { border-bottom: none; }

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// O clientId agora vem do uid de quem está logado (ver App/useAuth) —
// cada cliente só acessa os próprios dados automaticamente.

// <funnel-lib>
const DEFAULT_FUNNEL = [
  { key: "novo", label: "Novo", kind: "open", color: "var(--novo)" },
  { key: "em_conversa", label: "Em conversa", kind: "open", color: "var(--em-conversa)" },
  { key: "proposta", label: "Proposta enviada", kind: "open", color: "#5B7DB1" },
  { key: "convertido", label: "Fechou", kind: "won", color: "var(--convertido)" },
  { key: "perdido", label: "Perdido", kind: "lost", color: "var(--perdido)" },
];
const STAGE_PALETTE = ["var(--novo)", "var(--em-conversa)", "#5B7DB1", "#8A6FA8", "#B0803A", "var(--convertido)", "var(--perdido)"];
const HANDLING_LABELS = { call: "Ligação", mensagem: "Mensagem", audio: "Áudio" };

// Aceita só um funil válido (>=2 etapas, a primeira em andamento, com pelo menos uma "Fechou" e uma "Perdeu").
function normalizeFunnel(raw) {
  if (!Array.isArray(raw)) return DEFAULT_FUNNEL;
  const seen = new Set();
  const out = [];
  raw.forEach((s, i) => {
    const key = String((s && s.key) || "").trim();
    const label = String((s && s.label) || "").trim();
    if (!key || !label || seen.has(key)) return;
    seen.add(key);
    out.push({
      key,
      label,
      kind: s.kind === "won" || s.kind === "lost" ? s.kind : "open",
      color: s.color || STAGE_PALETTE[i % STAGE_PALETTE.length],
    });
  });
  const ok = out.length >= 2 && out[0].kind === "open" && out.some((s) => s.kind === "won") && out.some((s) => s.kind === "lost");
  return ok ? out : DEFAULT_FUNNEL;
}

// Etapa atual do contato. Contatos antigos só têm "status" — convertemos para o funil da cliente.
function stageOf(contact, funnel) {
  if (contact.stage && funnel.some((s) => s.key === contact.stage)) return contact.stage;
  const legacy = contact.status;
  if (legacy === "convertido") return (funnel.find((s) => s.kind === "won") || funnel[0]).key;
  if (legacy === "perdido") return (funnel.find((s) => s.kind === "lost") || funnel[0]).key;
  if (legacy === "em_conversa") {
    const open = funnel.filter((s) => s.kind === "open");
    return (open[1] || open[0] || funnel[0]).key;
  }
  return funnel[0].key;
}

// "status" antigo continua sendo gravado junto, para nada que já lê ele quebrar.
function legacyStatusFor(key, funnel) {
  const s = funnel.find((x) => x.key === key);
  if (!s) return "novo";
  if (s.kind === "won") return "convertido";
  if (s.kind === "lost") return "perdido";
  return funnel[0].key === key ? "novo" : "em_conversa";
}

function slugifyKey(label, existing) {
  const base =
    String(label).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "etapa";
  let key = base;
  let n = 2;
  while (existing.includes(key)) key = base + "_" + n++;
  return key;
}

// Leads, fechadas, em andamento, perdidas e conversão (fechou ÷ leads) por grupo.
function conversionStats(contacts, funnel, groupOf) {
  const map = new Map();
  contacts.forEach((c) => {
    const g = groupOf(c) || "nao_informado";
    const kind = (funnel.find((s) => s.key === stageOf(c, funnel)) || { kind: "open" }).kind;
    const r = map.get(g) || { group: g, total: 0, won: 0, lost: 0, open: 0 };
    r.total += 1;
    r[kind] += 1;
    map.set(g, r);
  });
  return Array.from(map.values()).map((r) => ({ ...r, rate: r.total ? r.won / r.total : 0 }));
}
// </funnel-lib>

const FunnelContext = React.createContext({ funnel: DEFAULT_FUNNEL, offers: [] });
function useFunnel() { return React.useContext(FunnelContext); }

// Funil e ofertas da cliente ficam no documento dela (clients/{uid}).
function useClientConfig(fb, clientId) {
  const [config, setConfig] = useState({ funnel: DEFAULT_FUNNEL, offers: [], custom: false });
  useEffect(() => {
    if (!fb || !clientId) return;
    const { db, collection, doc, onSnapshot } = fb;
    const ref = doc(collection(db, "clients"), clientId);
    const unsub = onSnapshot(ref, (snap) => {
      const d = snap.data() || {};
      setConfig({
        funnel: normalizeFunnel(d.funnel),
        offers: Array.isArray(d.offers) ? d.offers.filter((o) => typeof o === "string" && o.trim()) : [],
        custom: Array.isArray(d.funnel),
      });
    }, (err) => console.error("Erro ao carregar configuração:", err));
    return () => unsub();
  }, [fb, clientId]);
  return config;
}

const LEAD_TEMP_LABELS = {
  quente: "Quente",
  morno: "Morno",
  frio: "Frio",
  nao_abordado: "Não abordado",
};

const LEAD_TEMP_COLORS = {
  quente: "#C1502E",
  morno: "var(--accent)",
  frio: "#5C7A94",
  nao_abordado: "var(--muted)",
};

function initials(name) {
  if (!name) return "?";
  const parts = name.trim().split(/\s+/).slice(0, 2);
  return parts.map((p) => p[0]?.toUpperCase() || "").join("");
}

function formatRelativeTime(date) {
  if (!date) return "";
  const diffMs = Date.now() - date.getTime();
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 1) return "agora";
  if (diffMin < 60) return `${diffMin}min`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `${diffH}h`;
  const diffD = Math.floor(diffH / 24);
  if (diffD < 7) return `${diffD}d`;
  return date.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
}

function formatClock(date) {
  if (!date) return "";
  return date.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function toDate(value) {
  if (!value) return null;
  if (value.toDate) return value.toDate();
  return new Date(value);
}

function useContacts(fb, clientId) {
  const [contacts, setContacts] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!fb || !clientId) return;
    const { db, collection, doc, query, orderBy, onSnapshot } = fb;
    const contactsRef = collection(doc(collection(db, "clients"), clientId), "contacts");
    const q = query(contactsRef, orderBy("lastMessageAt", "desc"));

    const unsub = onSnapshot(
      q,
      (snap) => {
        setContacts(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        setLoading(false);
      },
      (err) => {
        console.error("Erro ao carregar contatos:", err);
        setLoading(false);
      }
    );
    return () => unsub();
  }, [fb, clientId]);

  return { contacts, loading };
}

function useMessages(fb, clientId, contactId) {
  const [messages, setMessages] = useState([]);

  useEffect(() => {
    if (!fb || !clientId || !contactId) { setMessages([]); return; }
    const { db, collection, doc, query, orderBy, onSnapshot } = fb;
    const contactRef = doc(collection(doc(collection(db, "clients"), clientId), "contacts"), contactId);
    const messagesRef = collection(contactRef, "messages");
    const q = query(messagesRef, orderBy("timestamp", "asc"));

    const unsub = onSnapshot(q, (snap) => {
      setMessages(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    }, (err) => console.error("Erro ao carregar mensagens:", err));

    return () => unsub();
  }, [fb, clientId, contactId]);

  return messages;
}

function StatusSelect({ contact, fb, clientId }) {
  const { funnel } = useFunnel();
  const stage = stageOf(contact, funnel);
  const current = funnel.find((x) => x.key === stage);

  function handleChange(e) {
    const { db, collection, doc, updateDoc, serverTimestamp } = fb;
    const contactRef = doc(collection(doc(collection(db, "clients"), clientId), "contacts"), contact.id);
    updateDoc(contactRef, {
      stage: e.target.value,
      status: legacyStatusFor(e.target.value, funnel),
      stageChangedAt: serverTimestamp(),
    }).catch((err) => console.error("Erro ao atualizar etapa:", err));
  }

  return (
    <select
      className="status-select"
      value={stage}
      onChange={handleChange}
      style={{ background: current ? current.color : "var(--muted)" }}
    >
      {funnel.map((st) => (
        <option key={st.key} value={st.key} style={{ color: "black", background: "white" }}>
          {st.label}
        </option>
      ))}
    </select>
  );
}

// Seletor simples para um campo de texto do contato (forma de condução, oferta).
function FieldSelect({ contact, fb, clientId, field, options, placeholder }) {
  function handleChange(e) {
    e.stopPropagation();
    const { db, collection, doc, updateDoc } = fb;
    const contactRef = doc(collection(doc(collection(db, "clients"), clientId), "contacts"), contact.id);
    updateDoc(contactRef, { [field]: e.target.value || null }).catch((err) =>
      console.error("Erro ao atualizar " + field + ":", err)
    );
  }
  const value = contact[field] || "";
  const known = options.some(([v]) => v === value);
  return (
    <select
      className="field-select"
      value={value}
      onClick={(e) => e.stopPropagation()}
      onChange={handleChange}
    >
      <option value="">{placeholder}</option>
      {options.map(([v, label]) => <option key={v} value={v}>{label}</option>)}
      {value && !known && <option value={value}>{value}</option>}
    </select>
  );
}

function ContactRow({ contact, selected, onClick }) {
  const { funnel } = useFunnel();
  const isNewStage = stageOf(contact, funnel) === funnel[0].key;
  const time = formatRelativeTime(toDate(contact.lastMessageAt));

  return (
    <div className={`contact-row${selected ? " selected" : ""}`} onClick={onClick}>
      <div className="avatar">{initials(contact.name)}</div>
      <div className="contact-info">
        <div className="contact-top">
          <span className="contact-name">{contact.name || contact.phone}</span>
          <span className="contact-time">{time}</span>
        </div>
        <div className="contact-preview">{contact.lastMessage || "—"}</div>
      </div>
      {isNewStage && <div className="pulse-dot" title="Novo contato" />}
    </div>
  );
}

function MessageBubble({ message }) {
  const time = formatClock(toDate(message.timestamp));
  const cls = message.fromMe ? "bubble me" : "bubble";

  if (message.messageType === "audio") {
    return (
      <div className={cls}>

      </div>

  return (
    <div className={cls}>

      <div className="bubble-time">{time}</div>
    </div>

}

const MONTH_NAMES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
const MONTH_NAMES_LONG = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

// Semana "dentro do mês" (1 a 5) — simples e didático, não é semana ISO do ano.
function weekOfMonth(date) {
  return Math.ceil(date.getDate() / 7);
}

function Timeline({ contacts }) {
  // level: 'year' | 'month' | 'week' | 'day'
  const [level, setLevel] = useState("year");
  const [yearFilter, setYearFilter] = useState(null);
  const [monthFilter, setMonthFilter] = useState(null); // 0-11
  const [weekFilter, setWeekFilter] = useState(null); // 1-5

  // Data de referência de cada contato: quando ele chegou (createdAt).
  // Contatos criados antes dessa funcionalidade não têm createdAt — caem fora do gráfico.
  const datedContacts = useMemo(
    () => contacts.map((c) => ({ ...c, _date: toDate(c.createdAt) })).filter((c) => c._date),
    [contacts]
  );

  const buckets = useMemo(() => {
    const map = new Map();

    datedContacts.forEach((c) => {
      const d = c._date;
      if (level === "year") {
        const key = d.getFullYear();
        map.set(key, (map.get(key) || 0) + 1);
        return;
      }
      if (d.getFullYear() !== yearFilter) return;

      if (level === "month") {
        const key = d.getMonth();
        map.set(key, (map.get(key) || 0) + 1);
        return;
      }
      if (d.getMonth() !== monthFilter) return;

      if (level === "week") {
        const key = weekOfMonth(d);
        map.set(key, (map.get(key) || 0) + 1);
        return;
      }
      if (weekOfMonth(d) !== weekFilter) return;

      if (level === "day") {
        const key = d.getDate();
        map.set(key, (map.get(key) || 0) + 1);
      }
    });

    return map;
  }, [datedContacts, level, yearFilter, monthFilter, weekFilter]);

  const sortedKeys = Array.from(buckets.keys()).sort((a, b) => a - b);
  const maxCount = Math.max(1, ...Array.from(buckets.values()));

  function labelFor(key) {
    if (level === "year") return String(key);
    if (level === "month") return MONTH_NAMES[key];
    if (level === "week") return `Sem ${key}`;
    return String(key).padStart(2, "0");
  }

  function drillDown(key) {
    if (level === "year") { setYearFilter(key); setLevel("month"); }
    else if (level === "month") { setMonthFilter(key); setLevel("week"); }
    else if (level === "week") { setWeekFilter(key); setLevel("day"); }
  }

  function goTo(targetLevel) {
    setLevel(targetLevel);
    if (targetLevel === "year") { setYearFilter(null); setMonthFilter(null); setWeekFilter(null); }
    if (targetLevel === "month") { setMonthFilter(null); setWeekFilter(null); }
    if (targetLevel === "week") { setWeekFilter(null); }
  }

  const isClickable = level !== "day";

  return (
    <div className="timeline">
      <div className="timeline-header">
        <div className="timeline-breadcrumb">
          <span className={`timeline-crumb${level === "year" ? " current" : ""}`} onClick={() => goTo("year")}>
            Todos os anos
          </span>
          {yearFilter != null && (
            <React.Fragment>
              <span>›</span>
              <span className={`timeline-crumb${level === "month" ? " current" : ""}`} onClick={() => goTo("month")}>
                {yearFilter}
              </span>
            </React.Fragment>
          )}
          {monthFilter != null && (
            <React.Fragment>
              <span>›</span>
              <span className={`timeline-crumb${level === "week" ? " current" : ""}`} onClick={() => goTo("week")}>
                {MONTH_NAMES_LONG[monthFilter]}
              </span>
            </React.Fragment>
          )}
          {weekFilter != null && (
            <React.Fragment>
              <span>›</span>
              <span className={`timeline-crumb${level === "day" ? " current" : ""}`}>
                Semana {weekFilter}
              </span>
            </React.Fragment>
          )}
        </div>
        {isClickable && <span className="timeline-hint">clique numa barra pra detalhar</span>}
      </div>

      {sortedKeys.length === 0 ? (
        <div className="timeline-empty">Sem contatos registrados nesse período.</div>
      ) : (
        <div className="timeline-bars">
          {sortedKeys.map((key) => {
            const count = buckets.get(key);
            const heightPct = Math.max(4, (count / maxCount) * 100);
            return (
              <div
                key={key}
                className={`timeline-bar-wrap${isClickable ? "" : " not-clickable"}`}
                onClick={() => isClickable && drillDown(key)}
                title={`${count} contato${count === 1 ? "" : "s"}`}
              >
                <span className="timeline-bar-count">{count}</span>
                <div className="timeline-bar" style={{ height: `${heightPct}%` }} />
                <span className="timeline-bar-label">{labelFor(key)}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// Palavras muito comuns em português que não geram insight nenhum na nuvem
const STOPWORDS_PT = new Set([
  "que","com","para","por","uma","um","uns","umas","os","as","dos","das","não",
  "sim","mais","mas","meu","minha","meus","minhas","seu","sua","seus","suas",
  "ele","ela","eles","elas","você","voce","vocês","voces","isso","isto","aqui",
  "ali","lá","la","também","tambem","como","quando","onde","porque","pois",
  "então","entao","muito","muita","muitos","muitas","já","ja","ainda","ser",
  "está","esta","estou","estamos","estão","estao","foi","era","são","sao",
  "tem","têm","tinha","ter","vou","vai","vamos","fazer","faz","pode","posso",
  "essa","esse","essas","esses","isso","aquele","aquela","depois","antes",
  "sobre","entre","até","ate","desde","cada","todo","toda","todos","todas",
  "oi","olá","ola","bom","boa","dia","tarde","noite","obrigada","obrigado",
  "tudo","bem","aqui","hoje","agora","pra","pro","num","numa","nos","nas",
  "the","and","for","you","are",
]);

function normalizeWord(w) {
  return w
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, ""); // remove acentos só pra comparar com stopwords
}

function hashWord(w) {
  let h = 0;
  for (let i = 0; i < w.length; i++) h = (h * 31 + w.charCodeAt(i)) % 1000;
  return h;
}

function useWordFrequency(fb, clientId, contacts) {
  const [freq, setFreq] = useState([]);
  const [loading, setLoading] = useState(true);
  const contactIdsKey = useMemo(() => contacts.map((c) => c.id).sort().join(","), [contacts]);

  // Nomes próprios conhecidos (os próprios contatos) — excluídos da nuvem,
  // já que aparecem só porque é o nome de quem está mandando a mensagem.
  const knownNames = useMemo(() => {
    const set = new Set();
    contacts.forEach((c) => {
      (c.name || "").split(/\s+/).forEach((part) => {
        const n = normalizeWord(part);
        if (n) set.add(n);
      });
    });
    return set;
  }, [contactIdsKey]);

  useEffect(() => {
    if (!fb || !clientId || contacts.length === 0) { setFreq([]); setLoading(false); return; }
    let cancelled = false;
    setLoading(true);

    const { db, collection, doc, getDocs } = fb;

    async function run() {
      const counts = new Map();
      await Promise.all(
        contacts.map(async (c) => {
          try {
            const contactRef = doc(collection(doc(collection(db, "clients"), clientId), "contacts"), c.id);
            const messagesRef = collection(contactRef, "messages");
            const snap = await getDocs(messagesRef);
            snap.forEach((docSnap) => {
              const m = docSnap.data();
              // A nuvem mostra o que as LEADS falam — mensagens enviadas por você ficam de fora.
              if (m.fromMe || m.messageType !== "text" || !m.text) return;
              const words = m.text.split(/[^\p{L}]+/u).filter(Boolean);
              words.forEach((raw) => {
                const normalized = normalizeWord(raw);
                if (normalized.length < 3 || STOPWORDS_PT.has(normalized) || knownNames.has(normalized)) return;
                const display = raw.toLowerCase();
                counts.set(display, (counts.get(display) || 0) + 1);
              });
            });
          } catch (err) {
            console.error("Erro ao ler mensagens pra nuvem de palavras:", err);
          }
        })
      );
      if (cancelled) return;
      const sorted = Array.from(counts.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, 40)
        .map(([word, count]) => ({ word, count }));
      setFreq(sorted);
      setLoading(false);
    }

    run();
    return () => { cancelled = true; };
  }, [fb, clientId, contactIdsKey]);

  return { freq, loading };
}

function WordCloud({ contacts, fb, clientId }) {
  const { freq, loading } = useWordFrequency(fb, clientId, contacts);
  const maxCount = Math.max(1, ...freq.map((f) => f.count));
  const minCount = Math.min(...(freq.length ? freq.map((f) => f.count) : [1]));

  function fontSizeFor(count) {
    if (maxCount === minCount) return 20;
    const t = (count - minCount) / (maxCount - minCount);
    return 13 + t * 24; // entre 13px e 37px
  }

  return (
    <div className="timeline">
      <div className="timeline-header">
        <span className="timeline-crumb current">Nuvem de palavras</span>
        <span className="timeline-hint">baseado nas mensagens de texto</span>
      </div>
      {loading && <div className="timeline-empty">Carregando…</div>}
      {!loading && freq.length === 0 && (
        <div className="timeline-empty">Ainda não há mensagens de texto suficientes pra formar a nuvem.</div>
      )}
      {!loading && freq.length > 0 && (
        <div className="wordcloud">
          {freq.map(({ word, count }) => {
            const rot = (hashWord(word) % 7) - 3;
            const useAccent = hashWord(word) % 3 === 0;
            return (
              <span
                key={word}
                className="wc-word"
                title={`${count}x`}
                style={{
                  fontSize: `${fontSizeFor(count)}px`,
                  transform: `rotate(${rot}deg)`,
                  color: useAccent ? "var(--accent)" : "var(--primary)",
                }}
              >
                {word}
              </span>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Overview({ contacts, fb, clientId }) {
  const { funnel } = useFunnel();
  const [expanded, setExpanded] = useState(null);

  const grouped = useMemo(() => {
    const base = {};
    funnel.forEach((st) => { base[st.key] = []; });
    contacts.forEach((c) => { base[stageOf(c, funnel)].push(c); });
    return base;
  }, [contacts, funnel]);

  function toggle(key) {
    if (grouped[key].length === 0) return;
    setExpanded((cur) => (cur === key ? null : key));
  }

  return (
    <div className="overview">
      <div>
        <div className="overview-grid">
          {funnel.map((st) => { const key = st.key; return (
            <div className="stat-cell" key={key}>
              <div
                className="stat-card"
                style={{ "--stat-color": st.color, cursor: grouped[key].length ? "pointer" : "default" }}
                onClick={() => toggle(key)}
                title={grouped[key].length ? "Clique pra ver quem são" : ""}
              >
                <div className="stat-number">{grouped[key].length}</div>
                <div className="stat-label">{st.label}</div>
              </div>
              {expanded === key && (
                <div className="status-expand">
                  {grouped[key].map((c) => (
                    <div key={c.id} className="status-expand-row">
                      <span>{c.name || "—"}</span>
                      <span className="report-phone-cell">{c.phone}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ); })}
        </div>
      </div>
      <ConversionView contacts={contacts} />
      {/* Nuvem de palavras em stand by (componente WordCloud mantido): <WordCloud contacts={contacts} fb={fb} clientId={clientId} /> */}
      <Timeline contacts={contacts} />
    </div>
  );
}

function NewContactModal({ fb, clientId, onClose, onSaved }) {
  const { funnel } = useFunnel();
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [conversa, setConversa] = useState("");
  const [stage, setStage] = useState(funnel[0].key);
  const [source, setSource] = useState("whatsapp");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  async function handleSubmit(e) {
    e.preventDefault();
    setError("");

    const cleanPhone = phone.replace(/\D/g, "");
    if (!cleanPhone) {
      setError("Informe um telefone válido.");
      return;
    }

    setSaving(true);
    try {
      const { db, collection, doc, setDoc, serverTimestamp } = fb;
      const contactRef = doc(collection(doc(collection(db, "clients"), clientId), "contacts"), cleanPhone);

      await setDoc(
        contactRef,
        {
          phone: cleanPhone,
          name: name || cleanPhone,
          source,
          stage,
          status: legacyStatusFor(stage, funnel),
          lastMessage: conversa || "—",
          lastMessageAt: serverTimestamp(),
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
        },
        { merge: true }
      );

      if (conversa.trim()) {
        const messagesRef = collection(contactRef, "messages");
        const messageRef = doc(messagesRef);
        await setDoc(messageRef, {
          messageType: "text",
          source,
          text: conversa,
          fromMe: false,
          timestamp: serverTimestamp(),
          messageId: messageRef.id,
        });
      }

      onSaved();
    } catch (err) {
      console.error("Erro ao cadastrar contato manual:", err);
      setError("Não consegui salvar. Tenta de novo.");
    } finally {
      setSaving(false);
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <form className="modal-card" onClick={(e) => e.stopPropagation()} onSubmit={handleSubmit}>
        <p className="modal-title">Novo contato</p>

        <div className="login-field">
          <label className="login-label">Nome</label>
          <input className="login-input" value={name} onChange={(e) => setName(e.target.value)} />

        <div className="login-field">

            className="login-input"
            value={phone}
            onChange={(e) => setPhone(e.target.value)}
            placeholder="5511999999999"
            required

        <div className="login-field">
          <label className="login-label">Conversa / observação inicial</label>
          <textarea className="modal-textarea" value={conversa} onChange={(e) => setConversa(e.target.value)} />

        <div className="login-field">
          <label className="login-label">Origem</label>

            className="login-input"

              <option key={key} value={key}>{label}</option>

        </div>

        <div className="login-field">
          <label className="login-label">Etapa</label>
          <select
            className="login-input"
            value={stage}

function NotesCell({ contact, fb, clientId }) {
  const [value, setValue] = useState(contact.notes || "");

  useEffect(() => {
    if (!editing) setValue(contact.notes || "");
  }, [contact.notes, editing]);

  function handleBlur() {
    setEditing(false);
    if (value === (contact.notes || "")) return;
    const { db, collection, doc, updateDoc } = fb;
    const contactRef = doc(collection(doc(collection(db, "clients"), clientId), "contacts"), contact.id);
    updateDoc(contactRef, { notes: value }).catch((err) =>
      console.error("Erro ao salvar observação:", err)
    );
  }

  return (
    <input
      className="notes-input"
      placeholder="Adicionar observação…"
      value={value}
      onClick={(e) => e.stopPropagation()}
      onFocus={() => setEditing(true)}
      onChange={(e) => setValue(e.target.value)}
      onBlur={handleBlur}
    />
  );
}

const FUNCTIONS_BASE = "https://southamerica-east1-wcrm-5cbe4.cloudfunctions.net";

async function callZapiFunction(fb, name, body) {
  const idToken = await fb.auth.currentUser.getIdToken();
  const resp = await fetch(`${FUNCTIONS_BASE}/${name}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${idToken}` },
    body: JSON.stringify(body || {}),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || "Erro na requisição");
  return data;
}

function ZapiConnect({ fb }) {
  const [qrCode, setQrCode] = useState(null);
  const [connected, setConnected] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const pollRef = useRef(null);

  // Ao abrir a tela, checa se já tem uma instância configurada e o status atual.
  useEffect(() => {
    if (!fb) return;
    callZapiFunction(fb, "wcrmZapiStatus")
      .then((data) => {
        if (data.configured) setConnected(!!data.connected);
      })
      .catch((err) => console.error("Erro ao checar status inicial:", err));
  }, [fb]);

  // Fica checando a conexão a cada 15s enquanto tem QR Code pendente na tela.
  useEffect(() => {
    if (!qrCode || connected) return;
    pollRef.current = setInterval(async () => {
      try {
        const data = await callZapiFunction(fb, "wcrmZapiStatus");
        if (data.connected) {
          setConnected(true);
          setQrCode(null);
          clearInterval(pollRef.current);
        }
      } catch (err) {
        console.error("Erro ao checar status:", err);
      }
    }, 15000);
    return () => clearInterval(pollRef.current);
  }, [qrCode, connected, fb]);

  async function handleConnect() {
    setError("");
    setLoading(true);
    try {
      const data = await callZapiFunction(fb, "wcrmZapiAutoConnect");
      if (data.qrCode) {
        setQrCode(data.qrCode);
        setConnected(false);
      } else {
        // Sem QR Code — provavelmente essa instância já está conectada. Confirma o status.
        const statusData = await callZapiFunction(fb, "wcrmZapiStatus");
        if (statusData.connected) {
          setConnected(true);
          setQrCode(null);
        } else {
          setError("Não recebemos o QR Code. Clica em conectar de novo em alguns segundos.");
        }
      }
    } catch (err) {
      console.error("Erro ao conectar:", err);
      setError(err.message || "Não consegui conectar. Tenta de novo em alguns segundos.");
    } finally {
      setLoading(false);
    }
  }

  async function handleRefreshQr() {
    setError("");
    setLoading(true);
    try {
      const data = await callZapiFunction(fb, "wcrmZapiQrCode");
      setQrCode(data.qrCode);
    } catch (err) {
      console.error("Erro ao buscar novo QR Code:", err);
      setError(err.message || "Não consegui buscar um novo QR Code.");
    } finally {
      setLoading(false);
    }
  }

  return (
    <div className="zapi-connect">
      {connected && (
        <div className="zapi-status-badge connected">🟢 WhatsApp conectado</div>
      )}
      {!connected && qrCode && (
        <div className="zapi-status-badge pending">🟡 Aguardando escaneamento</div>
      )}

      {!connected && !qrCode && (
        <React.Fragment>
          <p style={{ fontSize: "13px", color: "var(--muted)", marginBottom: "18px" }}>
            Clica no botão abaixo pra gerar o QR Code e conectar seu WhatsApp — sem precisar de nenhuma configuração técnica.
          </p>
          <button className="login-btn" onClick={handleConnect} disabled={loading} style={{ width: "auto", padding: "10px 20px" }}>
            {loading ? "Gerando QR Code…" : "Conectar WhatsApp"}
          </button>
          {error && <p className="login-error">{error}</p>}
        </React.Fragment>
      )}

      {!connected && qrCode && (
        <div className="zapi-qr-box">
          <img src={qrCode} alt="QR Code do WhatsApp" />
          <p style={{ fontSize: "12px", color: "var(--muted)", marginTop: "12px" }}>
            Abre o WhatsApp no celular → Aparelhos conectados → Conectar um aparelho, e escaneia.
            <br />O código expira rápido — se sumir, pede um novo abaixo.
          </p>
          <button className="logout-btn" style={{ marginTop: "10px" }} onClick={handleRefreshQr}>
            Gerar novo QR Code
          </button>
        </div>
      )}

      {connected && (
        <React.Fragment>
          <p style={{ fontSize: "13px", color: "var(--muted)" }}>
            Seu WhatsApp está conectado ao Trilha. As próximas mensagens já vão aparecer no Relatório automaticamente.
          </p>
        </React.Fragment>
      )}
    </div>
  );
}

function formatDateInput(date) {
  if (!date) return "";
  const d = toDate(date) || date;
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

function addToDate(dateStr, amount, unit) {
  const base = dateStr ? new Date(dateStr + "T00:00:00") : new Date();
  if (unit === "month") base.setMonth(base.getMonth() + amount);
  if (unit === "year") base.setFullYear(base.getFullYear() + amount);
  return formatDateInput(base);
}

function ClientAccessForm({ fb, initial, onClose, onSaved }) {
  const [email, setEmail] = useState(initial?.email || "");
  const [instanceId, setInstanceId] = useState(initial?.zapiInstanceId || "");
  const [instanceToken, setInstanceToken] = useState(initial?.zapiToken || "");
  const [accessUntil, setAccessUntil] = useState(formatDateInput(initial?.accessUntil));
  const [situacao, setSituacao] = useState(initial?.situacao || "pendente");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  async function handleSubmit(e) {
    e.preventDefault();
    setError("");
    const cleanEmail = email.trim().toLowerCase();
    if (!cleanEmail) { setError("Informe o e-mail da cliente."); return; }

    setSaving(true);
    try {
      const { db, collection, doc, setDoc, getDocs, query, where } = fb;
      const accessUntilDate = accessUntil ? new Date(accessUntil + "T23:59:59") : null;

      // Já existe como cliente (já se cadastrou e/ou conectou)? Atualiza direto na ficha dela.
      const clientsRef = collection(db, "clients");
      const existingQuery = await getDocs(query(clientsRef, where("email", "==", cleanEmail)));

      if (!existingQuery.empty) {
        const clientDoc = existingQuery.docs[0];
        await setDoc(
          clientDoc.ref,
          {
            situacao,
            ...(accessUntilDate ? { accessUntil: accessUntilDate } : {}),
            ...(instanceId ? { zapiInstanceId: instanceId } : {}),
            ...(instanceToken ? { zapiToken: instanceToken } : {}),
          },
          { merge: true }
        );
      }

      // Sempre atualiza também a reserva por e-mail (pendingAccess) — é o que
      // é usado se ela ainda não conectou, ou serve de registro histórico.
      const pendingRef = doc(collection(db, "pendingAccess"), cleanEmail);
      await setDoc(
        pendingRef,
        {
          instanceId,
          instanceToken,
          situacao,
          ...(accessUntilDate ? { accessUntil: accessUntilDate } : {}),
          // Não sobrescreve o status de "claimed" se já foi usada — só define
          // como pending se for um registro novo.
          ...(existingQuery.empty ? { status: "pending" } : {}),
        },
        { merge: true }
      );

      onSaved();
    } catch (err) {
      console.error("Erro ao salvar acesso da cliente:", err);
      setError("Não consegui salvar. Tenta de novo.");
    } finally {
      setSaving(false);
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <form className="modal-card" onClick={(e) => e.stopPropagation()} onSubmit={handleSubmit}>
        <p className="modal-title">{initial ? "Editar acesso" : "Liberar / renovar cliente"}</p>

        <div className="login-field">
          <label className="login-label">E-mail da cliente</label>
          <input
            className="login-input"
            type="email"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            disabled={!!initial}
            required
          />
        </div>

        <div className="login-field">
          <label className="login-label">ID da instância Z-API</label>
          <input className="login-input" value={instanceId} onChange={(e) => setInstanceId(e.target.value)} />
        </div>

        <div className="login-field">
          <label className="login-label">Token da instância Z-API</label>
          <input className="login-input" value={instanceToken} onChange={(e) => setInstanceToken(e.target.value)} />
        </div>

        <div className="login-field">
          <label className="login-label">Acesso até</label>
          <input
            className="login-input"
            type="date"
            value={accessUntil}
            onChange={(e) => setAccessUntil(e.target.value)}
          />
          <div className="quick-date-row">
            <button type="button" className="quick-date-btn" onClick={() => setAccessUntil(addToDate(accessUntil, 1, "month"))}>+1 mês</button>
            <button type="button" className="quick-date-btn" onClick={() => setAccessUntil(addToDate(accessUntil, 3, "month"))}>+3 meses</button>
            <button type="button" className="quick-date-btn" onClick={() => setAccessUntil(addToDate(accessUntil, 1, "year"))}>+1 ano</button>
          </div>
        </div>

        <div className="login-field">
          <label className="login-label">Situação</label>
          <select className="login-input" value={situacao} onChange={(e) => setSituacao(e.target.value)} style={{ cursor: "pointer" }}>
            {Object.entries(SITUACAO_LABELS).map(([key, label]) => (
              <option key={key} value={key}>{label}</option>
            ))}
          </select>
        </div>

        {error && <p className="login-error">{error}</p>}

        <div className="modal-actions">
          <button type="button" className="modal-btn-secondary" onClick={onClose}>Cancelar</button>
          <button type="submit" className="modal-btn-primary" disabled={saving}>
            {saving ? "Salvando…" : "Salvar acesso"}
          </button>
        </div>
      </form>
    </div>
  );
}
