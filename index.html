<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WCRM — Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #F1EFE6;
    --surface: #FFFFFF;
    --ink: #20261F;
    --muted: #6B7570;
    --border: #E4E0D4;
    --primary: #24504B;
    --primary-light: #DCEAE6;
    --accent: #D98E2B;
    --accent-light: #F7E6C9;
    --novo: #D98E2B;
    --em-conversa: #24504B;
    --convertido: #3E7A4E;
    --perdido: #A15A45;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    height: 100vh;
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .sidebar.hide-mobile { display: none; }
    .conversation.hide-mobile { display: none; }
  }

  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .sidebar-header {
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 2px;
    color: var(--primary);
  }
  .brand-sub {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 14px;
  }
  .search {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
  }
  .search:focus { border-color: var(--primary); }

  .filters {
    display: flex;
    gap: 6px;
    padding: 12px 20px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
  }
  .filter-pill {
    font-size: 11.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .filter-pill.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  /* Menu lateral */
  .nav-menu {
    flex: 1;
    padding: 8px 12px;
    overflow-y: auto;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--muted);
    margin-bottom: 3px;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .nav-item .nav-icon { font-size: 15px; width: 18px; text-align: center; }
  .nav-item.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 500;
  }
  .nav-item:hover:not(.active) { background: var(--bg); }
  .nav-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }

  /* Área principal (relatório / visão geral / conversa) */
  .main-toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .main-toolbar .search { max-width: 320px; }
  .main-body {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }

  .report-table-wrap { overflow-x: auto; }
  .report-table {
    width: 100%;
    border-collapse: collapse;
  }
  .report-table th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    padding: 12px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
  }
  .report-row {
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .report-row:hover { background: var(--surface); }
  .report-table td {
    padding: 13px 28px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    vertical-align: middle;
  }
  .report-name-cell {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Fraunces', serif;
    font-weight: 500;
  }
  .report-phone-cell {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--muted);
  }
  .report-date-cell {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .status-pill-small {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    color: white;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    white-space: nowrap;
  }
  .notes-input {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    color: var(--ink);
    padding: 5px 8px;
    border-radius: 6px;
    outline: none;
  }
  .notes-input:hover { background: var(--bg); }
  .notes-input:focus { background: var(--bg); border-color: var(--primary); }
  .notes-input::placeholder { color: var(--muted); }

  .contact-list {
    flex: 1;
    overflow-y: auto;
  }
  .contact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 20px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    position: relative;
    transition: background 0.12s ease;
  }
  .contact-row:hover { background: var(--bg); }
  .contact-row.selected { background: var(--primary-light); }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    flex-shrink: 0;
  }
  .contact-info { min-width: 0; flex: 1; }
  .contact-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .contact-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .contact-time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .contact-preview {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--novo);
    flex-shrink: 0;
    box-shadow: 0 0 0 0 rgba(217, 142, 43, 0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(217, 142, 43, 0.5); }
    70%  { box-shadow: 0 0 0 7px rgba(217, 142, 43, 0); }
    100% { box-shadow: 0 0 0 0 rgba(217, 142, 43, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse-dot { animation: none; }
  }

  .empty-list {
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  /* Conversation panel */
  .conversation {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--bg);
  }
  .conv-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .conv-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .conv-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    margin: 0;
  }
  .conv-phone {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin: 2px 0 0;
  }
  .back-btn {
    display: none;
    border: none;
    background: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--primary);
    padding: 0 4px;
  }
  @media (max-width: 760px) {
    .back-btn { display: block; }
  }

  .status-select {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    cursor: pointer;
    outline: none;
    color: white;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 62%;
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.5;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .bubble-time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
  }
  .bubble-audio {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .bubble-audio audio { height: 32px; max-width: 220px; }

  .close-btn {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    padding: 6px 8px;
    border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .close-btn:hover {
    background: var(--bg);
    color: var(--ink);
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .overview {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    gap: 28px;
  }
  .overview-title {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    color: var(--muted);
    margin: 0;
    text-align: center;
  }
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(140px, 1fr));
    gap: 14px;
    align-items: start;
  }
  .stat-cell {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 22px;
    min-width: 140px;
    border-top: 3px solid var(--stat-color, var(--primary));
  }
  .stat-number {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1;
    color: var(--ink);
  }
  .stat-label {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 6px;
  }
  .status-expand {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .status-expand-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 13px;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .status-expand-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }
  .status-expand-row:last-child { border-bottom: none; }

  .timeline {
    width: 100%;
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
  }
  .timeline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .timeline-breadcrumb {
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .timeline-crumb {
    cursor: pointer;
    color: var(--primary);
    font-weight: 500;
  }
  .timeline-crumb:hover { text-decoration: underline; }
  .timeline-crumb.current {
    color: var(--ink);
    cursor: default;
    text-decoration: none;
    font-family: 'Fraunces', serif;
  }
  .timeline-hint {
    font-size: 11px;
    color: var(--muted);
  }
  .timeline-selects {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .timeline-select {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
    outline: none;
  }
  .timeline-select:focus { border-color: var(--primary); }
  .timeline-bars {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 120px;
  }
  .timeline-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    cursor: pointer;
    min-width: 0;
  }
  .timeline-bar-wrap.not-clickable { cursor: default; }
  .timeline-bar-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .timeline-bar {
    width: 100%;
    max-width: 34px;
    background: var(--primary);
    border-radius: 4px 4px 0 0;
    min-height: 3px;
    transition: opacity 0.15s ease;
  }
  .timeline-bar-wrap:not(.not-clickable):hover .timeline-bar { opacity: 0.75; }
  .timeline-bar-label {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 6px;
    white-space: nowrap;
  }
  .timeline-empty {
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
    padding: 30px 0;
  }
  .wordcloud {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    justify-content: center;
    padding: 8px 4px 4px;
  }
  .wc-word {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    line-height: 1;
    cursor: default;
    display: inline-block;
  }

  .login-screen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 32px;
    width: 100%;
    max-width: 340px;
  }
  .login-brand {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--primary);
    margin: 0 0 4px;
    text-align: center;
  }
  .login-sub {
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
    margin: 0 0 24px;
  }
  .login-field { margin-bottom: 14px; }
  .login-label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .login-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
  }
  .login-input:focus { border-color: var(--primary); }
  .login-btn {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: white;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 6px;
  }
  .login-btn:disabled { opacity: 0.6; cursor: default; }
  .login-error {
    color: var(--perdido);
    font-size: 12px;
    margin-top: 10px;
    text-align: center;
  }
  .logout-btn {
    font-size: 11.5px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }

  .zapi-connect {
    max-width: 460px;
    margin: 0 auto;
    padding: 32px 24px;
  }
  .zapi-field { margin-bottom: 14px; }
  .zapi-qr-box {
    text-align: center;
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-top: 20px;
  }
  .zapi-qr-box img {
    width: 220px;
    height: 220px;
    border-radius: 8px;
  }
  .zapi-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .zapi-status-badge.connected { background: var(--primary-light); color: var(--primary); }
  .zapi-status-badge.pending { background: var(--accent-light); color: var(--accent); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(32, 38, 31, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    margin: 0 0 18px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .modal-btn-secondary {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    cursor: pointer;
  }
  .modal-btn-primary {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: white;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .modal-btn-primary:disabled { opacity: 0.6; cursor: default; }
  .modal-textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
    resize: vertical;
    min-height: 70px;
  }
  .modal-textarea:focus { border-color: var(--primary); }
  .add-contact-btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: white;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, doc, onSnapshot, query, orderBy, updateDoc, getDocs, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // Configuração do projeto Firebase do WCRM
  const firebaseConfig = {
    apiKey: "AIzaSyDILpDDcsaAB7_6trvvBnpH1tq2iDFLuoE",
    authDomain: "wcrm-5cbe4.firebaseapp.com",
    projectId: "wcrm-5cbe4",
    storageBucket: "wcrm-5cbe4.firebasestorage.app",

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// O clientId agora vem do uid de quem está logado (ver App/useAuth) —
// cada cliente só acessa os próprios dados automaticamente.

const STATUS_LABELS = {
  novo: "Novo",
  em_conversa: "Em conversa",
  convertido: "Convertido",
  perdido: "Perdido",
};

const STATUS_COLORS = {
  novo: "var(--novo)",
  em_conversa: "var(--em-conversa)",
  convertido: "var(--convertido)",
  perdido: "var(--perdido)",
};

const LEAD_TEMP_LABELS = {
  quente: "Quente",
  morno: "Morno",
  frio: "Frio",
  nao_abordado: "Não abordado",
};

const LEAD_TEMP_COLORS = {
  quente: "#C1502E",
  morno: "var(--accent)",
  frio: "#5C7A94",
  nao_abordado: "var(--muted)",
};

function initials(name) {
  if (!name) return "?";
  const parts = name.trim().split(/\s+/).slice(0, 2);
  return parts.map((p) => p[0]?.toUpperCase() || "").join("");
}

function formatRelativeTime(date) {
  if (!date) return "";
  const diffMs = Date.now() - date.getTime();
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 1) return "agora";
  if (diffMin < 60) return `${diffMin}min`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH < 24) return `${diffH}h`;
  const diffD = Math.floor(diffH / 24);
  if (diffD < 7) return `${diffD}d`;
  return date.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
}

function formatClock(date) {
  if (!date) return "";
  return date.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function toDate(value) {
  if (!value) return null;
  if (value.toDate) return value.toDate();
  return new Date(value);
}

function useContacts(fb, clientId) {
  const [contacts, setContacts] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!fb || !clientId) return;
    const { db, collection, doc, query, orderBy, onSnapshot } = fb;
    const contactsRef = collection(doc(collection(db, "clients"), clientId), "contacts");
    const q = query(contactsRef, orderBy("lastMessageAt", "desc"));

    const unsub = onSnapshot(
      q,
      (snap) => {
        setContacts(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
        setLoading(false);
      },
      (err) => {
        console.error("Erro ao carregar contatos:", err);
        setLoading(false);
      }
    );
    return () => unsub();
  }, [fb, clientId]);

  return { contacts, loading };
}

function useMessages(fb, clientId, contactId) {
  const [messages, setMessages] = useState([]);

  useEffect(() => {
    if (!fb || !clientId || !contactId) { setMessages([]); return; }
    const { db, collection, doc, query, orderBy, onSnapshot } = fb;
    const contactRef = doc(collection(doc(collection(db, "clients"), clientId), "contacts"), contactId);
    const messagesRef = collection(contactRef, "messages");
    const q = query(messagesRef, orderBy("timestamp", "asc"));

    const unsub = onSnapshot(q, (snap) => {
      setMessages(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    }, (err) => console.error("Erro ao carregar mensagens:", err));

    return () => unsub();
  }, [fb, clientId, contactId]);

  return messages;
}

function StatusSelect({ contact, fb, clientId }) {
  const status = contact.status || "novo";

  function handleChange(e) {
    const { db, collection, doc, updateDoc } = fb;
    const contactRef = doc(collection(doc(collection(db, "clients"), clientId), "contacts"), contact.id);
    updateDoc(contactRef, { status: e.target.value }).catch((err) =>
      console.error("Erro ao atualizar status:", err)
    );
  }

  return (
    <select
      className="status-select"
      value={status}
      onChange={handleChange}
      style={{ background: STATUS_COLORS[status] || "var(--muted)" }}
    >
      {Object.entries(STATUS_LABELS).map(([key, label]) => (
        <option key={key} value={key} style={{ color: "black", background: "white" }}>
          {label}
        </option>
      ))}
    </select>
  );
}

function ContactRow({ contact, selected, onClick }) {
  const status = contact.status || "novo";
  const time = formatRelativeTime(toDate(contact.lastMessageAt));

  return (
    <div className={`contact-row${selected ? " selected" : ""}`} onClick={onClick}>
      <div className="avatar">{initials(contact.name)}</div>
      <div className="contact-info">
        <div className="contact-top">
          <span className="contact-name">{contact.name || contact.phone}</span>
          <span className="contact-time">{time}</span>
        </div>
        <div className="contact-preview">{contact.lastMessage || "—"}</div>
      </div>
      {status === "novo" && <div className="pulse-dot" title="Novo contato" />}
    </div>
  );
}

function MessageBubble({ message }) {
  const time = formatClock(toDate(message.timestamp));

  if (message.messageType === "audio") {
    return (
      <div className="bubble">
        <div className="bubble-audio">
          <span>🎤</span>
          <audio controls src={message.audioUrl}></audio>
        </div>
        <div className="bubble-time">{time} · {message.seconds}s</div>
      </div>
    );
  }

  return (
    <div className="bubble">
      <div>{message.text}</div>
      <div className="bubble-time">{time}</div>
    </div>
  );
}

const MONTH_NAMES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
const MONTH_NAMES_LONG = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

// Semana "dentro do mês" (1 a 5) — simples e didático, não é semana ISO do ano.
function weekOfMonth(date) {
  return Math.ceil(date.getDate() / 7);
}

function Timeline({ contacts }) {
  // level: 'year' | 'month' | 'week' | 'day'
  const [level, setLevel] = useState("year");
  const [yearFilter, setYearFilter] = useState(null);
  const [monthFilter, setMonthFilter] = useState(null); // 0-11
  const [weekFilter, setWeekFilter] = useState(null); // 1-5

  // Data de referência de cada contato: quando ele chegou (createdAt).
  // Contatos criados antes dessa funcionalidade não têm createdAt — caem fora do gráfico.
  const datedContacts = useMemo(
    () => contacts.map((c) => ({ ...c, _date: toDate(c.createdAt) })).filter((c) => c._date),
    [contacts]
  );

  const buckets = useMemo(() => {
    const map = new Map();

    datedContacts.forEach((c) => {
      const d = c._date;
      if (level === "year") {
        const key = d.getFullYear();
        map.set(key, (map.get(key) || 0) + 1);
        return;
      }
      if (d.getFullYear() !== yearFilter) return;

      if (level === "month") {
        const key = d.getMonth();
        map.set(key, (map.get(key) || 0) + 1);
        return;
      }
      if (d.getMonth() !== monthFilter) return;

      if (level === "week") {
        const key = weekOfMonth(d);
        map.set(key, (map.get(key) || 0) + 1);
        return;
      }
      if (weekOfMonth(d) !== weekFilter) return;

      if (level === "day") {
        const key = d.getDate();
        map.set(key, (map.get(key) || 0) + 1);
      }
    });

    return map;
  }, [datedContacts, level, yearFilter, monthFilter, weekFilter]);

  const sortedKeys = Array.from(buckets.keys()).sort((a, b) => a - b);
  const maxCount = Math.max(1, ...Array.from(buckets.values()));

  function labelFor(key) {
    if (level === "year") return String(key);
    if (level === "month") return MONTH_NAMES[key];
    if (level === "week") return `Sem ${key}`;
    return String(key).padStart(2, "0");
  }

  function drillDown(key) {
    if (level === "year") { setYearFilter(key); setLevel("month"); }
    else if (level === "month") { setMonthFilter(key); setLevel("week"); }
    else if (level === "week") { setWeekFilter(key); setLevel("day"); }
  }

  function goTo(targetLevel) {
    setLevel(targetLevel);
    if (targetLevel === "year") { setYearFilter(null); setMonthFilter(null); setWeekFilter(null); }
    if (targetLevel === "month") { setMonthFilter(null); setWeekFilter(null); }
    if (targetLevel === "week") { setWeekFilter(null); }
  }

  const isClickable = level !== "day";

  return (
    <div className="timeline">
      <div className="timeline-header">
        <div className="timeline-breadcrumb">
          <span className={`timeline-crumb${level === "year" ? " current" : ""}`} onClick={() => goTo("year")}>
            Todos os anos
          </span>
          {yearFilter != null && (
            <React.Fragment>
              <span>›</span>
              <span className={`timeline-crumb${level === "month" ? " current" : ""}`} onClick={() => goTo("month")}>
                {yearFilter}
              </span>
            </React.Fragment>
          )}
          {monthFilter != null && (
            <React.Fragment>
              <span>›</span>
              <span className={`timeline-crumb${level === "week" ? " current" : ""}`} onClick={() => goTo("week")}>
                {MONTH_NAMES_LONG[monthFilter]}
              </span>
            </React.Fragment>
          )}
          {weekFilter != null && (
            <React.Fragment>
              <span>›</span>
              <span className={`timeline-crumb${level === "day" ? " current" : ""}`}>
                Semana {weekFilter}
              </span>
            </React.Fragment>
          )}
        </div>
        {isClickable && <span className="timeline-hint">clique numa barra pra detalhar</span>}
      </div>

      {sortedKeys.length === 0 ? (
        <div className="timeline-empty">Sem contatos registrados nesse período.</div>
      ) : (
        <div className="timeline-bars">
          {sortedKeys.map((key) => {
            const count = buckets.get(key);
            const heightPct = Math.max(4, (count / maxCount) * 100);
            return (
              <div
                key={key}
                className={`timeline-bar-wrap${isClickable ? "" : " not-clickable"}`}
                onClick={() => isClickable && drillDown(key)}
                title={`${count} contato${count === 1 ? "" : "s"}`}
              >
                <span className="timeline-bar-count">{count}</span>
                <div className="timeline-bar" style={{ height: `${heightPct}%` }} />
                <span className="timeline-bar-label">{labelFor(key)}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// Palavras muito comuns em português que não geram insight nenhum na nuvem
const STOPWORDS_PT = new Set([
  "que","com","para","por","uma","um","uns","umas","os","as","dos","das","não",
  "sim","mais","mas","meu","minha","meus","minhas","seu","sua","seus","suas",
  "ele","ela","eles","elas","você","voce","vocês","voces","isso","isto","aqui",
  "ali","lá","la","também","tambem","como","quando","onde","porque","pois",
  "então","entao","muito","muita","muitos","muitas","já","ja","ainda","ser",
  "está","esta","estou","estamos","estão","estao","foi","era","são","sao",
  "tem","têm","tinha","ter","vou","vai","vamos","fazer","faz","pode","posso",
  "essa","esse","essas","esses","isso","aquele","aquela","depois","antes",
  "sobre","entre","até","ate","desde","cada","todo","toda","todos","todas",
  "oi","olá","ola","bom","boa","dia","tarde","noite","obrigada","obrigado",
  "tudo","bem","aqui","hoje","agora","pra","pro","num","numa","nos","nas",
  "the","and","for","you","are",
]);

function normalizeWord(w) {
  return w
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, ""); // remove acentos só pra comparar com stopwords
}

function hashWord(w) {
  let h = 0;
  for (let i = 0; i < w.length; i++) h = (h * 31 + w.charCodeAt(i)) % 1000;
  return h;
}

function useWordFrequency(fb, clientId, contacts) {
  const [freq, setFreq] = useState([]);
  const [loading, setLoading] = useState(true);
  const contactIdsKey = useMemo(() => contacts.map((c) => c.id).sort().join(","), [contacts]);

  // Nomes próprios conhecidos (os próprios contatos) — excluídos da nuvem,
  // já que aparecem só porque é o nome de quem está mandando a mensagem.
  const knownNames = useMemo(() => {
    const set = new Set();
    contacts.forEach((c) => {
      (c.name || "").split(/\s+/).forEach((part) => {
        const n = normalizeWord(part);
        if (n) set.add(n);
      });
    });
    return set;
  }, [contactIdsKey]);

  useEffect(() => {
    if (!fb || !clientId || contacts.length === 0) { setFreq([]); setLoading(false); return; }
    let cancelled = false;
    setLoading(true);

    const { db, collection, doc, getDocs } = fb;

    async function run() {
      const counts = new Map();
      await Promise.all(
        contacts.map(async (c) => {
          try {
            const contactRef = doc(collection(doc(collection(db, "clients"), clientId), "contacts"), c.id);
            const messagesRef = collection(contactRef, "messages");
            const snap = await getDocs(messagesRef);
            snap.forEach((docSnap) => {
              const m = docSnap.data();
              if (m.messageType !== "text" || !m.text) return;
              const words = m.text.split(/[^\p{L}]+/u).filter(Boolean);
              words.forEach((raw) => {
                const normalized = normalizeWord(raw);
                if (normalized.length < 3 || STOPWORDS_PT.has(normalized) || knownNames.has(normalized)) return;
                const display = raw.toLowerCase();
                counts.set(display, (counts.get(display) || 0) + 1);
              });
            });
          } catch (err) {
            console.error("Erro ao ler mensagens pra nuvem de palavras:", err);
          }
        })
      );
      if (cancelled) return;
      const sorted = Array.from(counts.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, 40)
        .map(([word, count]) => ({ word, count }));
      setFreq(sorted);
      setLoading(false);
    }

    run();
    return () => { cancelled = true; };
  }, [fb, clientId, contactIdsKey]);

  return { freq, loading };
}

function WordCloud({ contacts, fb, clientId }) {
  const { freq, loading } = useWordFrequency(fb, clientId, contacts);
  const maxCount = Math.max(1, ...freq.map((f) => f.count));
  const minCount = Math.min(...(freq.length ? freq.map((f) => f.count) : [1]));

  function fontSizeFor(count) {
    if (maxCount === minCount) return 20;
    const t = (count - minCount) / (maxCount - minCount);
    return 13 + t * 24; // entre 13px e 37px
  }

  return (
    <div className="timeline">
      <div className="timeline-header">
        <span className="timeline-crumb current">Nuvem de palavras</span>
        <span className="timeline-hint">baseado nas mensagens de texto</span>
      </div>
      {loading && <div className="timeline-empty">Carregando…</div>}
      {!loading && freq.length === 0 && (
        <div className="timeline-empty">Ainda não há mensagens de texto suficientes pra formar a nuvem.</div>
      )}
      {!loading && freq.length > 0 && (
        <div className="wordcloud">
          {freq.map(({ word, count }) => {
            const rot = (hashWord(word) % 7) - 3;
            const useAccent = hashWord(word) % 3 === 0;
            return (
              <span
                key={word}
                className="wc-word"
                title={`${count}x`}
                style={{
                  fontSize: `${fontSizeFor(count)}px`,
                  transform: `rotate(${rot}deg)`,
                  color: useAccent ? "var(--accent)" : "var(--primary)",
                }}
              >
                {word}
              </span>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Overview({ contacts, fb, clientId }) {
  const [expanded, setExpanded] = useState(null);

  const grouped = useMemo(() => {
    const base = { novo: [], em_conversa: [], convertido: [], perdido: [] };
    contacts.forEach((c) => {
      const status = c.status || "novo";
      if (base[status]) base[status].push(c);
    });
    return base;
  }, [contacts]);

  function toggle(key) {
    if (grouped[key].length === 0) return;
    setExpanded((cur) => (cur === key ? null : key));
  }

  return (
    <div className="overview">
      <div>
        <div className="overview-grid">
          {Object.entries(STATUS_LABELS).map(([key, label]) => (
            <div className="stat-cell" key={key}>
              <div
                className="stat-card"
                style={{ "--stat-color": STATUS_COLORS[key], cursor: grouped[key].length ? "pointer" : "default" }}
                onClick={() => toggle(key)}
                title={grouped[key].length ? "Clique pra ver quem são" : ""}
              >
                <div className="stat-number">{grouped[key].length}</div>
                <div className="stat-label">{label}</div>
              </div>
              {expanded === key && (
                <div className="status-expand">
                  {grouped[key].map((c) => (
                    <div key={c.id} className="status-expand-row">
                      <span>{c.name || "—"}</span>
                      <span className="report-phone-cell">{c.phone}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
      <WordCloud contacts={contacts} fb={fb} clientId={clientId} />
      <Timeline contacts={contacts} />
    </div>
  );
}

function NewContactModal({ fb, clientId, onClose, onSaved }) {
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [conversa, setConversa] = useState("");
  const [status, setStatus] = useState("novo");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  async function handleSubmit(e) {
    e.preventDefault();
    setError("");

    const cleanPhone = phone.replace(/\D/g, "");
    if (!cleanPhone) {
      setError("Informe um telefone válido.");
      return;
    }

    setSaving(true);
    try {
      const { db, collection, doc, setDoc, serverTimestamp } = fb;
      const contactRef = doc(collection(doc(collection(db, "clients"), clientId), "contacts"), cleanPhone);

      await setDoc(
        contactRef,
        {
          phone: cleanPhone,
          name: name || cleanPhone,
          source: "manual",
          status,
          lastMessage: conversa || "—",
          lastMessageAt: serverTimestamp(),
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
        },
        { merge: true }
      );

      if (conversa.trim()) {
        const messagesRef = collection(contactRef, "messages");
        const messageRef = doc(messagesRef);
        await setDoc(messageRef, {
          messageType: "text",
          source: "manual",
          text: conversa,
          fromMe: false,
          timestamp: serverTimestamp(),
          messageId: messageRef.id,
        });
      }

      onSaved();
    } catch (err) {
      console.error("Erro ao cadastrar contato manual:", err);
      setError("Não consegui salvar. Tenta de novo.");
    } finally {
      setSaving(false);
    }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <form className="modal-card" onClick={(e) => e.stopPropagation()} onSubmit={handleSubmit}>
        <p className="modal-title">Novo contato</p>

        <div className="login-field">
          <label className="login-label">Nome</label>
          <input className="login-input" value={name} onChange={(e) => setName(e.target.value)} />
        </div>

        <div className="login-field">
          <label className="login-label">Telefone</label>
          <input
            className="login-input"
            value={phone}
            onChange={(e) => setPhone(e.target.value)}
            placeholder="5511999999999"
            required
          />
        </div>

        <div className="login-field">
          <label className="login-label">Conversa / observação inicial</label>
          <textarea className="modal-textarea" value={conversa} onChange={(e) => setConversa(e.target.value)} />
        </div>

        <div className="login-field">
          <label className="login-label">Status</label>
          <select
            className="login-input"
            value={status}
            onChange={(e) => setStatus(e.target.value)}
            style={{ cursor: "pointer" }}
          >
            {Object.entries(STATUS_LABELS).map(([key, label]) => (
              <option key={key} value={key}>{label}</option>
            ))}
          </select>
        </div>

        {error && <p className="login-error">{error}</p>}

        <div className="modal-actions">
          <button type="button" className="modal-btn-secondary" onClick={onClose}>Cancelar</button>
          <button type="submit" className="modal-btn-primary" disabled={saving}>
            {saving ? "Salvando…" : "Salvar contato"}
          </button>
        </div>
      </form>
    </div>
  );
}

function formatDateShort(date) {
  if (!date) return "—";
  return date.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
}

function LeadTempSelect({ contact, fb, clientId }) {
  const temp = contact.leadTemperature || "nao_abordado";

  function handleChange(e) {
    e.stopPropagation();
    const { db, collection, doc, updateDoc } = fb;
    const contactRef = doc(collection(doc(collection(db, "clients"), clientId), "contacts"), contact.id);
    updateDoc(contactRef, { leadTemperature: e.target.value }).catch((err) =>
      console.error("Erro ao atualizar status do lead:", err)
    );
  }

  return (
    <select
      className="status-select"
      value={temp}
      onClick={(e) => e.stopPropagation()}
      onChange={handleChange}
      style={{ background: LEAD_TEMP_COLORS[temp], fontSize: "11px", padding: "4px 9px" }}
    >
      {Object.entries(LEAD_TEMP_LABELS).map(([key, label]) => (
        <option key={key} value={key} style={{ color: "black", background: "white" }}>
          {label}
        </option>
      ))}
    </select>
  );
}

function NotesCell({ contact, fb, clientId }) {
  const [value, setValue] = useState(contact.notes || "");
  const [editing, setEditing] = useState(false);

  useEffect(() => {
    if (!editing) setValue(contact.notes || "");
  }, [contact.notes, editing]);

  function handleBlur() {
    setEditing(false);
    if (value === (contact.notes || "")) return;
    const { db, collection, doc, updateDoc } = fb;
    const contactRef = doc(collection(doc(collection(db, "clients"), clientId), "contacts"), contact.id);
    updateDoc(contactRef, { notes: value }).catch((err) =>
      console.error("Erro ao salvar observação:", err)
    );
  }

  return (
    <input
      className="notes-input"
      placeholder="Adicionar observação…"
      value={value}
      onClick={(e) => e.stopPropagation()}
      onFocus={() => setEditing(true)}
      onChange={(e) => setValue(e.target.value)}
      onBlur={handleBlur}
    />
  );
}

const FUNCTIONS_BASE = "https://southamerica-east1-wcrm-5cbe4.cloudfunctions.net";

async function callZapiFunction(fb, name, body) {
  const idToken = await fb.auth.currentUser.getIdToken();
  const resp = await fetch(`${FUNCTIONS_BASE}/${name}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${idToken}` },
    body: JSON.stringify(body || {}),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || "Erro na requisição");
  return data;
}

function ZapiConnect({ fb }) {
  const [qrCode, setQrCode] = useState(null);
  const [connected, setConnected] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [importing, setImporting] = useState(false);
  const [importResult, setImportResult] = useState(null);
  const [importError, setImportError] = useState("");
  const pollRef = useRef(null);

  // Ao abrir a tela, checa se já tem uma instância configurada e o status atual.
  useEffect(() => {
    if (!fb) return;
    callZapiFunction(fb, "wcrmZapiStatus")
      .then((data) => {
        if (data.configured) setConnected(!!data.connected);
      })
      .catch((err) => console.error("Erro ao checar status inicial:", err));
  }, [fb]);

  // Fica checando a conexão a cada 15s enquanto tem QR Code pendente na tela.
  useEffect(() => {
    if (!qrCode || connected) return;
    pollRef.current = setInterval(async () => {
      try {
        const data = await callZapiFunction(fb, "wcrmZapiStatus");
        if (data.connected) {
          setConnected(true);
          setQrCode(null);
          clearInterval(pollRef.current);
        }
      } catch (err) {
        console.error("Erro ao checar status:", err);
      }
    }, 15000);
    return () => clearInterval(pollRef.current);
  }, [qrCode, connected, fb]);

  async function handleConnect() {
    setError("");
    setLoading(true);
    try {
      const data = await callZapiFunction(fb, "wcrmZapiAutoConnect");
      setQrCode(data.qrCode);
      setConnected(false);
    } catch (err) {
      console.error("Erro ao conectar:", err);
      setError(err.message || "Não consegui conectar. Tenta de novo em alguns segundos.");
    } finally {
      setLoading(false);
    }
  }

  async function handleRefreshQr() {
    setError("");
    setLoading(true);
    try {
      const data = await callZapiFunction(fb, "wcrmZapiQrCode");
      setQrCode(data.qrCode);
    } catch (err) {
      console.error("Erro ao buscar novo QR Code:", err);
      setError(err.message || "Não consegui buscar um novo QR Code.");
    } finally {
      setLoading(false);
    }
  }

  async function handleImportHistory() {
    setImportError("");
    setImportResult(null);
    setImporting(true);
    try {
      const data = await callZapiFunction(fb, "wcrmZapiImportHistory");
      setImportResult(data);
    } catch (err) {
      console.error("Erro ao importar histórico:", err);
      setImportError(err.message || "Não consegui importar o histórico.");
    } finally {
      setImporting(false);
    }
  }

  return (
    <div className="zapi-connect">
      {connected && (
        <div className="zapi-status-badge connected">🟢 WhatsApp conectado</div>
      )}
      {!connected && qrCode && (
        <div className="zapi-status-badge pending">🟡 Aguardando escaneamento</div>
      )}

      {!connected && !qrCode && (
        <React.Fragment>
          <p style={{ fontSize: "13px", color: "var(--muted)", marginBottom: "18px" }}>
            Clica no botão abaixo pra gerar o QR Code e conectar seu WhatsApp — sem precisar de nenhuma configuração técnica.
          </p>
          <button className="login-btn" onClick={handleConnect} disabled={loading} style={{ width: "auto", padding: "10px 20px" }}>
            {loading ? "Gerando QR Code…" : "Conectar WhatsApp"}
          </button>
          {error && <p className="login-error">{error}</p>}
        </React.Fragment>
      )}

      {!connected && qrCode && (
        <div className="zapi-qr-box">
          <img src={qrCode} alt="QR Code do WhatsApp" />
          <p style={{ fontSize: "12px", color: "var(--muted)", marginTop: "12px" }}>
            Abre o WhatsApp no celular → Aparelhos conectados → Conectar um aparelho, e escaneia.
            <br />O código expira rápido — se sumir, pede um novo abaixo.
          </p>
          <button className="logout-btn" style={{ marginTop: "10px" }} onClick={handleRefreshQr}>
            Gerar novo QR Code
          </button>
        </div>
      )}

      {connected && (
        <p style={{ fontSize: "13px", color: "var(--muted)" }}>
          Seu WhatsApp está conectado ao WCRM. As próximas mensagens já vão aparecer no Relatório automaticamente.
          Conversas de antes de conectar não são importadas automaticamente — se quiser trazer um lead antigo,
          cadastra ele manualmente no Relatório.
        </p>
      )}
    </div>
  );
}

function Dashboard({ fb, clientId, userEmail, onLogout }) {
  const [view, setView] = useState("report"); // 'report' | 'overview'
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("todos");
  const [yearFilter, setYearFilter] = useState(null);
  const [monthFilter, setMonthFilter] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [mobileShowMain, setMobileShowMain] = useState(false);
  const [showNewContact, setShowNewContact] = useState(false);

  const { contacts, loading } = useContacts(fb, clientId);
  const messages = useMessages(fb, clientId, selectedId);
  const messagesEndRef = useRef(null);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages]);

  // Anos com pelo menos um contato — só esses aparecem no seletor.
  const availableYears = useMemo(() => {
    const years = new Set();
    contacts.forEach((c) => {
      const d = toDate(c.createdAt);
      if (d) years.add(d.getFullYear());
    });
    return Array.from(years).sort((a, b) => b - a);
  }, [contacts]);

  // Meses com pelo menos um contato dentro do ano selecionado.
  const availableMonths = useMemo(() => {
    if (yearFilter == null) return [];
    const months = new Set();
    contacts.forEach((c) => {
      const d = toDate(c.createdAt);
      if (d && d.getFullYear() === yearFilter) months.add(d.getMonth());
    });
    return Array.from(months).sort((a, b) => a - b);
  }, [contacts, yearFilter]);

  function handleYearFilterChange(e) {
    const value = e.target.value;
    setYearFilter(value === "" ? null : Number(value));
    setMonthFilter(null);
  }

  function handleMonthFilterChange(e) {
    const value = e.target.value;
    setMonthFilter(value === "" ? null : Number(value));
  }

  // Filtro de data (ano/mês) — aplica em tudo: relatório e visão geral.
  const dateFilteredContacts = useMemo(() => {
    if (yearFilter == null) return contacts;
    return contacts.filter((c) => {
      const d = toDate(c.createdAt);
      if (!d) return false;
      if (d.getFullYear() !== yearFilter) return false;
      if (monthFilter != null && d.getMonth() !== monthFilter) return false;
      return true;
    });
  }, [contacts, yearFilter, monthFilter]);

  const filteredContacts = useMemo(() => {
    return dateFilteredContacts.filter((c) => {
      const matchesStatus = statusFilter === "todos" || (c.status || "novo") === statusFilter;
      const matchesSearch =
        !search ||
        (c.name || "").toLowerCase().includes(search.toLowerCase()) ||
        (c.phone || "").includes(search);
      return matchesStatus && matchesSearch;
    });
  }, [dateFilteredContacts, search, statusFilter]);

  const selectedContact = contacts.find((c) => c.id === selectedId);

  function goToView(v) {
    setView(v);
    setSelectedId(null);
    setMobileShowMain(true);
  }

  function selectContact(id) {
    setSelectedId(id);
    setMobileShowMain(true);
  }

  function closeConversation() {
    setSelectedId(null);
  }

  function backToMenu() {
    setSelectedId(null);
    setMobileShowMain(false);
  }

  return (
    <div className="app">
      <div className={`sidebar${mobileShowMain ? " hide-mobile" : ""}`}>
        <div className="sidebar-header">
          <p className="brand">WCRM</p>
          <p className="brand-sub">Suas conversas do WhatsApp, organizadas.</p>
        </div>
        <div className="nav-menu">
          <div className={`nav-item${view === "overview" ? " active" : ""}`} onClick={() => goToView("overview")}>
            <span className="nav-icon">◐</span> Visão geral
          </div>
          <div className={`nav-item${view === "report" ? " active" : ""}`} onClick={() => goToView("report")}>
            <span className="nav-icon">☰</span> Relatório
          </div>
          <div className={`nav-item${view === "zapi" ? " active" : ""}`} onClick={() => goToView("zapi")}>
            <span className="nav-icon">⚡</span> Conectar WhatsApp
          </div>
        </div>
        <div className="nav-footer">
          <span style={{ fontSize: "11px", color: "var(--muted)", display: "block", marginBottom: "4px" }}>
            {userEmail}
          </span>
          <button className="logout-btn" onClick={onLogout}>Sair</button>
        </div>
      </div>

      <div className={`conversation${!mobileShowMain ? " hide-mobile" : ""}`}>
        {selectedContact ? (
          <React.Fragment>
            <div className="conv-header">
              <div className="conv-header-left">
                <button className="back-btn" onClick={() => setMobileShowMain(false)}>←</button>
                <div className="avatar">{initials(selectedContact.name)}</div>
                <div>
                  <p className="conv-name">{selectedContact.name || selectedContact.phone}</p>
                  <p className="conv-phone">{selectedContact.phone}</p>
                </div>
              </div>
              <div className="header-actions">
                <StatusSelect contact={selectedContact} fb={fb} clientId={clientId} />
                <button className="close-btn" title="Voltar ao relatório" onClick={closeConversation}>
                  ✕
                </button>
              </div>
            </div>
            <div className="messages">
              {messages.map((m) => <MessageBubble key={m.id} message={m} />)}
              <div ref={messagesEndRef} />
            </div>
          </React.Fragment>
        ) : view === "report" ? (
          <React.Fragment>
            <div className="main-toolbar">
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <button className="back-btn" style={{ alignSelf: "flex-start" }} onClick={backToMenu}>←</button>
                <button className="add-contact-btn" onClick={() => setShowNewContact(true)}>+ Novo contato</button>
              </div>
              <input
                className="search"
                placeholder="Buscar por nome ou telefone"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
              />
              <div className="filters" style={{ padding: 0, border: "none" }}>
                <div
                  className={`filter-pill${statusFilter === "todos" ? " active" : ""}`}
                  onClick={() => setStatusFilter("todos")}
                >
                  Todos
                </div>
                {Object.entries(STATUS_LABELS).map(([key, label]) => (
                  <div
                    key={key}
                    className={`filter-pill${statusFilter === key ? " active" : ""}`}
                    onClick={() => setStatusFilter(key)}
                  >
                    {label}
                  </div>
                ))}
              </div>
              {availableYears.length > 0 && (
                <div style={{ display: "flex", gap: 8 }}>
                  <select className="timeline-select" value={yearFilter ?? ""} onChange={handleYearFilterChange}>
                    <option value="">Todos os anos</option>
                    {availableYears.map((y) => <option key={y} value={y}>{y}</option>)}
                  </select>
                  {yearFilter != null && availableMonths.length > 0 && (
                    <select className="timeline-select" value={monthFilter ?? ""} onChange={handleMonthFilterChange}>
                      <option value="">Mês (todos)</option>
                      {availableMonths.map((m) => <option key={m} value={m}>{MONTH_NAMES_LONG[m]}</option>)}
                    </select>
                  )}
                </div>
              )}
            </div>
            <div className="main-body">
              {loading ? (
                <div className="empty-list">Carregando contatos…</div>
              ) : (
                <ReportTable contacts={filteredContacts} onSelect={selectContact} fb={fb} clientId={clientId} />
              )}
            </div>
          </React.Fragment>
        ) : view === "overview" ? (
          <React.Fragment>
            <div className="main-toolbar" style={{ flexDirection: "row", alignItems: "center" }}>
              <button className="back-btn" onClick={backToMenu}>←</button>
              <span style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: "16px" }}>Visão geral</span>
              {yearFilter != null && (
                <span style={{ fontSize: "12px", color: "var(--muted)" }}>
                  · filtrado por {monthFilter != null ? `${MONTH_NAMES_LONG[monthFilter]}/${yearFilter}` : yearFilter}
                </span>
              )}
            </div>
            <div className="main-body">
              <Overview contacts={dateFilteredContacts} fb={fb} clientId={clientId} />
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div className="main-toolbar" style={{ flexDirection: "row", alignItems: "center" }}>
              <button className="back-btn" onClick={backToMenu}>←</button>
              <span style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: "16px" }}>Conectar WhatsApp</span>
            </div>
            <div className="main-body">
              <ZapiConnect fb={fb} />
            </div>
          </React.Fragment>
        )}
      </div>
      {showNewContact && (
        <NewContactModal
          fb={fb}
          clientId={clientId}
          onClose={() => setShowNewContact(false)}
          onSaved={() => setShowNewContact(false)}
        />
      )}
    </div>
  );
}

function Login({ fb }) {
  const [mode, setMode] = useState("login"); // 'login' | 'signup' | 'reset'
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [loading, setLoading] = useState(false);

  function handleSubmit(e) {
    e.preventDefault();
    if (!fb) return;
    setError("");
    setInfo("");
    setLoading(true);

    if (mode === "reset") {
      fb.sendPasswordResetEmail(fb.auth, email)
        .then(() => setInfo("Te mandamos um e-mail com o link pra criar uma senha nova. Confere também a caixa de spam."))
        .catch((err) => {
          console.error("Erro ao enviar e-mail de redefinição:", err);
          if (err.code === "auth/invalid-email") setError("E-mail inválido.");
          else if (err.code === "auth/user-not-found") setError("E-mail não encontrado.");
          else setError("Não consegui enviar o e-mail. Confere se digitou certo.");
        })
        .finally(() => setLoading(false));
      return;
    }

    const action =
      mode === "signup"
        ? fb.createUserWithEmailAndPassword(fb.auth, email, password)
        : fb.signInWithEmailAndPassword(fb.auth, email, password);

    action
      .catch((err) => {
        console.error("Erro de autenticação:", err);
        if (err.code === "auth/email-already-in-use") {
          setError("Esse e-mail já tem conta. Tenta entrar em vez de cadastrar.");
        } else if (err.code === "auth/weak-password") {
          setError("A senha precisa ter pelo menos 6 caracteres.");
        } else if (err.code === "auth/invalid-email") {
          setError("E-mail inválido.");
        } else if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
          setError("E-mail ou senha incorretos.");
        } else {
          setError(mode === "signup" ? "Não consegui criar sua conta." : "E-mail ou senha incorretos.");
        }
      })
      .finally(() => setLoading(false));
  }

  return (
    <div className="login-screen">
      <form className="login-card" onSubmit={handleSubmit}>
        <p className="login-brand">WCRM</p>
        <p className="login-sub">
          {mode === "signup" ? "Cria sua conta pra começar" : mode === "reset" ? "Recupera o acesso à sua conta" : "Entre pra ver suas conversas do WhatsApp"}
        </p>
        <div className="login-field">
          <label className="login-label">E-mail</label>
          <input
            className="login-input"
            type="email"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            required
            autoFocus
          />
        </div>
        {mode !== "reset" && (
          <div className="login-field">
            <label className="login-label">Senha</label>
            <input
              className="login-input"
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              required
              minLength={6}
            />
          </div>
        )}
        <button className="login-btn" type="submit" disabled={loading}>
          {loading ? "Aguarda…" : mode === "signup" ? "Criar conta" : mode === "reset" ? "Enviar link de redefinição" : "Entrar"}
        </button>
        {error && <p className="login-error">{error}</p>}
        {info && <p style={{ fontSize: "12px", color: "var(--primary)", textAlign: "center", marginTop: "10px" }}>{info}</p>}

        {mode === "login" && (
          <p style={{ textAlign: "center", fontSize: "12px", marginTop: "10px" }}>
            <span className="logout-btn" onClick={() => { setMode("reset"); setError(""); setInfo(""); }}>Esqueci minha senha</span>
          </p>
        )}

        <p style={{ textAlign: "center", fontSize: "12px", color: "var(--muted)", marginTop: "16px" }}>
          {mode === "signup" ? (
            <React.Fragment>
              Já tem conta?{" "}
              <span className="logout-btn" onClick={() => { setMode("login"); setError(""); setInfo(""); }}>Entrar</span>
            </React.Fragment>
          ) : mode === "reset" ? (
            <React.Fragment>
              Lembrou a senha?{" "}
              <span className="logout-btn" onClick={() => { setMode("login"); setError(""); setInfo(""); }}>Entrar</span>
            </React.Fragment>
          ) : (
            <React.Fragment>
              Ainda não tem conta?{" "}
              <span className="logout-btn" onClick={() => { setMode("signup"); setError(""); setInfo(""); }}>Criar conta</span>
            </React.Fragment>
          )}
        </p>
      </form>
    </div>
  );
}

function App() {
  const [fb, setFb] = useState(window.__wcrmFirebase || null);
  const [user, setUser] = useState(undefined); // undefined = ainda não sabemos; null = deslogado

  useEffect(() => {
    if (fb) return;
    function onReady() { setFb(window.__wcrmFirebase); }
    window.addEventListener("wcrm-firebase-ready", onReady);
    return () => window.removeEventListener("wcrm-firebase-ready", onReady);
  }, [fb]);

  useEffect(() => {
    if (!fb) return;
    const unsub = fb.onAuthStateChanged(fb.auth, (u) => setUser(u || null));
    return () => unsub();
  }, [fb]);

  function handleLogout() {
    if (fb) fb.signOut(fb.auth);
  }

  if (!fb || user === undefined) {
    return <div className="login-screen"><p style={{ color: "var(--muted)", fontFamily: "IBM Plex Sans, sans-serif" }}>Carregando…</p></div>;
  }

  if (!user) {
    return <Login fb={fb} />;
  }

  return (
    <Dashboard fb={fb} clientId={user.uid} userEmail={user.email} onLogout={handleLogout} />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
