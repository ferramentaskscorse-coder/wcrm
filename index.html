                  {c.accessUntil ? `até ${formatDateShort(toDate(c.accessUntil))}` : "sem data definida"}
                  {c.zapiInstanceId ? " · WhatsApp configurado" : " · sem instância"}
                </div>
              </div>
              <button className="admin-edit-btn" onClick={() => setEditing(c)}>Editar</button>
            </div>
          );
        })}
      </div>

      {editing && (
        <ClientAccessForm
          fb={fb}
          initial={editing.id ? editing : null}
          onClose={() => setEditing(null)}
          onSaved={refresh}
        />
      )}
    </div>
  );
}

function StatsTable({ rows, labelOf, firstColLabel }) {
  const total = rows.reduce((a, r) => ({ total: a.total + r.total, won: a.won + r.won, lost: a.lost + r.lost, open: a.open + r.open }), { total: 0, won: 0, lost: 0, open: 0 });
  const totalRate = total.total ? total.won / total.total : 0;
  const pct = (x) => (x * 100).toLocaleString("pt-BR", { maximumFractionDigits: 0 }) + "%";
  return (
    <div className="report-table-wrap">
      <table className="report-table">
        <thead>
          <tr>
            <th>{firstColLabel}</th><th>Leads</th><th>Em andamento</th><th>Fechou</th><th>Perdeu</th><th>Conversão</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r) => (
            <tr key={r.group}>
              <td>{labelOf(r.group)}</td>
              <td>{r.total}</td>
              <td>{r.open}</td>
              <td>{r.won}</td>
              <td>{r.lost}</td>
              <td>
                <strong>{pct(r.rate)}</strong>{" "}
                <span style={{ fontSize: "11px", color: "var(--muted)" }}>
                  ({r.won} de {r.total}){r.total < 10 ? " · poucas leads" : ""}
                </span>
              </td>
            </tr>
          ))}
          <tr>
            <td><strong>Total</strong></td>
            <td><strong>{total.total}</strong></td>
            <td>{total.open}</td>
            <td>{total.won}</td>
            <td>{total.lost}</td>
            <td><strong>{pct(totalRate)}</strong></td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

function ConversionView({ contacts }) {
  const { funnel, offers } = useFunnel();
  const [offerFilter, setOfferFilter] = useState("todas");

  const scoped = useMemo(
    () => (offerFilter === "todas" ? contacts : contacts.filter((c) => (c.offer || "") === offerFilter)),
    [contacts, offerFilter]
  );
  const order = ["call", "mensagem", "audio", "nao_informado"];
  const byHandling = useMemo(
    () => conversionStats(scoped, funnel, (c) => c.handling)
      .sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group)),
    [scoped, funnel]
  );
  const byOffer = useMemo(
    () => conversionStats(contacts, funnel, (c) => c.offer).sort((a, b) => b.total - a.total),
    [contacts, funnel]
  );
  const handlingLabel = (g) => HANDLING_LABELS[g] || "Não informada";
  const unmarked = (byHandling.find((r) => r.group === "nao_informado") || { total: 0 }).total;

  if (contacts.length === 0) return <div className="empty-list">Ainda não há contatos nesse período.</div>;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: "22px" }}>
      <div>
        <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 10, flexWrap: "wrap" }}>
          <span style={{ fontFamily: "'Fraunces', serif", fontWeight: 600 }}>Conversão por forma de condução</span>
          {offers.length > 0 && (
            <select className="timeline-select" value={offerFilter} onChange={(e) => setOfferFilter(e.target.value)}>
              <option value="todas">Todas as ofertas</option>
              {offers.map((o) => <option key={o} value={o}>{o}</option>)}
            </select>
          )}
        </div>
        <StatsTable rows={byHandling} labelOf={handlingLabel} firstColLabel="Forma de condução" />
        {unmarked > 0 && (
          <p style={{ fontSize: "12.5px", color: "var(--muted)", marginTop: 8 }}>
            {unmarked} lead(s) ainda sem forma de condução. Marque na coluna "Condução" do Relatório para entrarem na conta.
          </p>
        )}
      </div>
      {offers.length > 0 && (
        <div>
          <p style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, marginBottom: 10 }}>Conversão por oferta</p>
          <StatsTable rows={byOffer} labelOf={(g) => (g === "nao_informado" ? "Sem oferta marcada" : g)} firstColLabel="Oferta" />
        </div>
      )}
      <p style={{ fontSize: "12px", color: "var(--muted)", lineHeight: 1.5 }}>
        Conversão = leads que fecharam ÷ total de leads. Ela mostra o que aconteceu, não o motivo: quem aceita uma call
        costuma já ser uma lead mais interessada. Com poucas leads, o número ainda não permite conclusão.
      </p>
    </div>
  );
}

const KIND_LABELS = { open: "Em andamento", won: "Fechou", lost: "Perdeu" };

function FunnelEditor({ fb, clientId, config }) {
  const [stages, setStages] = useState(config.funnel);
  const [offers, setOffers] = useState(config.offers);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState("");
  const [error, setError] = useState("");

  function updateStage(i, patch) { setStages((cur) => cur.map((s, j) => (j === i ? { ...s, ...patch } : s))); }
  function move(i, d) {
    setStages((cur) => {
      const j = i + d;
      if (j < 0 || j >= cur.length) return cur;
      const next = cur.slice();
      [next[i], next[j]] = [next[j], next[i]];
      return next;
    });
  }
  function addStage() {
    setStages((cur) => {
      const key = slugifyKey("Nova etapa", cur.map((s) => s.key));
      const at = Math.max(1, cur.findIndex((s) => s.kind !== "open"));
      const next = cur.slice();
      next.splice(at === -1 ? cur.length : at, 0, { key, label: "Nova etapa", kind: "open", color: STAGE_PALETTE[cur.length % STAGE_PALETTE.length] });
      return next;
    });
  }

  async function handleSave() {
    setError(""); setMsg("");
    const cleaned = stages.map((s) => ({ ...s, label: s.label.trim() }));
    if (cleaned.some((s) => !s.label)) return setError("Toda etapa precisa de um nome.");
    if (cleaned.length < 2) return setError("Mantenha pelo menos 2 etapas.");
    if (cleaned[0].kind !== "open") return setError("A primeira etapa precisa ser 'Em andamento' (é onde as leads novas entram).");
    if (!cleaned.some((s) => s.kind === "won")) return setError("Precisa de uma etapa 'Fechou' (venda feita).");
    if (!cleaned.some((s) => s.kind === "lost")) return setError("Precisa de uma etapa 'Perdeu'.");
    const cleanOffers = offers.map((o) => o.trim()).filter(Boolean);
    setSaving(true);
    try {
      const { db, collection, doc, setDoc } = fb;
      await setDoc(doc(collection(db, "clients"), clientId), { funnel: cleaned, offers: cleanOffers }, { merge: true });
      setMsg("Salvo!");
    } catch (err) {
      console.error("Erro ao salvar funil:", err);
      setError("Não consegui salvar. Tenta de novo.");
    } finally { setSaving(false); }
  }

  const small = { padding: "6px 10px", fontSize: "13px" };
  return (
    <div style={{ maxWidth: 620 }}>
      <p style={{ fontSize: "13px", color: "var(--muted)", marginBottom: 14, lineHeight: 1.5 }}>
        Defina as etapas do seu funil, na ordem em que a venda acontece. Cada etapa conta como "Em andamento",
        "Fechou" ou "Perdeu" — é isso que alimenta a tela de Conversão. Contatos de uma etapa removida voltam para a primeira.
      </p>
      {stages.map((st, i) => (
        <div key={st.key} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8, flexWrap: "wrap" }}>
          <span style={{ width: 12, height: 12, borderRadius: 999, background: st.color, flex: "none" }} />
          <input className="login-input" style={{ flex: "1 1 160px", ...small }} value={st.label}
            onChange={(e) => updateStage(i, { label: e.target.value })} />
          <select className="login-input" style={{ width: 140, ...small }} value={st.kind}
            onChange={(e) => updateStage(i, { kind: e.target.value })}>
            {Object.entries(KIND_LABELS).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
          </select>
          <button type="button" className="modal-btn-secondary" style={small} onClick={() => move(i, -1)} disabled={i === 0}>↑</button>
          <button type="button" className="modal-btn-secondary" style={small} onClick={() => move(i, 1)} disabled={i === stages.length - 1}>↓</button>
          <button type="button" className="modal-btn-secondary" style={small} onClick={() => setStages((c) => c.filter((_, j) => j !== i))} disabled={stages.length <= 2}>Remover</button>
        </div>
      ))}
      <button type="button" className="modal-btn-secondary" style={{ ...small, marginTop: 4 }} onClick={addStage}>+ Adicionar etapa</button>

      <p style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, margin: "26px 0 6px" }}>Ofertas (opcional)</p>
      <p style={{ fontSize: "12.5px", color: "var(--muted)", marginBottom: 10 }}>
        Se você vende mais de uma coisa (ex.: "Passeio", "Consultoria"), liste aqui. Aparece uma coluna "Oferta" no Relatório
        e a conversão passa a ser separada por oferta.
      </p>
      {offers.map((o, i) => (
        <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <input className="login-input" style={{ flex: 1, ...small }} value={o}
            onChange={(e) => setOffers((cur) => cur.map((x, j) => (j === i ? e.target.value : x)))} />
          <button type="button" className="modal-btn-secondary" style={small} onClick={() => setOffers((c) => c.filter((_, j) => j !== i))}>Remover</button>
        </div>
      ))}
      <button type="button" className="modal-btn-secondary" style={small} onClick={() => setOffers((c) => [...c, ""])}>+ Adicionar oferta</button>

      {error && <p className="login-error" style={{ marginTop: 14 }}>{error}</p>}
      {msg && <p style={{ color: "var(--primary)", fontSize: "13px", marginTop: 14 }}>{msg}</p>}
      <div style={{ marginTop: 18 }}>
        <button type="button" className="modal-btn-primary" onClick={handleSave} disabled={saving}>
          {saving ? "Salvando…" : "Salvar funil"}
        </button>
      </div>
    </div>
  );
}

function Dashboard({ fb, clientId, userEmail, onLogout }) {
  const [view, setView] = useState("report"); // 'report' | 'overview'
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("todos");
  const [yearFilter, setYearFilter] = useState(null);
  const [monthFilter, setMonthFilter] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [mobileShowMain, setMobileShowMain] = useState(false);
  const [showNewContact, setShowNewContact] = useState(false);

  const { contacts, loading } = useContacts(fb, clientId);
  const config = useClientConfig(fb, clientId);
  const { funnel, offers } = config;
  const messages = useMessages(fb, clientId, selectedId);
  const messagesEndRef = useRef(null);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages]);

  // Anos com pelo menos um contato — só esses aparecem no seletor.
  const availableYears = useMemo(() => {
    const years = new Set();
    contacts.forEach((c) => {
      const d = toDate(c.createdAt);
      if (d) years.add(d.getFullYear());
    });
    return Array.from(years).sort((a, b) => b - a);
  }, [contacts]);

  // Meses com pelo menos um contato dentro do ano selecionado.
  const availableMonths = useMemo(() => {
    if (yearFilter == null) return [];
    const months = new Set();
    contacts.forEach((c) => {
      const d = toDate(c.createdAt);
      if (d && d.getFullYear() === yearFilter) months.add(d.getMonth());
    });
    return Array.from(months).sort((a, b) => a - b);
  }, [contacts, yearFilter]);

  function handleYearFilterChange(e) {
    const value = e.target.value;
    setYearFilter(value === "" ? null : Number(value));
    setMonthFilter(null);
  }

  function handleMonthFilterChange(e) {
    const value = e.target.value;
    setMonthFilter(value === "" ? null : Number(value));
  }

  // Filtro de data (ano/mês) — aplica em tudo: relatório e visão geral.
  const dateFilteredContacts = useMemo(() => {
    if (yearFilter == null) return contacts;
    return contacts.filter((c) => {
      const d = toDate(c.createdAt);
      if (!d) return false;
      if (d.getFullYear() !== yearFilter) return false;
      if (monthFilter != null && d.getMonth() !== monthFilter) return false;
      return true;
    });
  }, [contacts, yearFilter, monthFilter]);

  const filteredContacts = useMemo(() => {
    return dateFilteredContacts.filter((c) => {
      const matchesStatus = statusFilter === "todos" || stageOf(c, funnel) === statusFilter;
      const matchesSearch =
        !search ||
        (c.name || "").toLowerCase().includes(search.toLowerCase()) ||
        (c.phone || "").includes(search);
      return matchesStatus && matchesSearch;
    });
  }, [dateFilteredContacts, search, statusFilter, funnel]);

  const selectedContact = contacts.find((c) => c.id === selectedId);

  function goToView(v) {
    setView(v);
    setSelectedId(null);
    setMobileShowMain(true);
  }

  function selectContact(id) {
    setSelectedId(id);
    setMobileShowMain(true);
  }

  function closeConversation() {
    setSelectedId(null);
  }

  function backToMenu() {
    setSelectedId(null);
    setMobileShowMain(false);
  }

  return (
    <FunnelContext.Provider value={config}>
    <div className="app">
      <div className={`sidebar${mobileShowMain ? " hide-mobile" : ""}`}>
        <div className="sidebar-header">
          <p className="brand">Trilha</p>
          <p className="brand-sub">Suas conversas do WhatsApp, organizadas.</p>
        </div>
        <div className="nav-menu">
          <div className={`nav-item${view === "overview" ? " active" : ""}`} onClick={() => goToView("overview")}>
            <span className="nav-icon">◐</span> Visão geral
          </div>
          <div className={`nav-item${view === "report" ? " active" : ""}`} onClick={() => goToView("report")}>
            <span className="nav-icon">☰</span> Relatório
          </div>
          <div className={`nav-item${view === "funnel" ? " active" : ""}`} onClick={() => goToView("funnel")}>
            <span className="nav-icon">⚙</span> Meu funil
          </div>
          <div className={`nav-item${view === "zapi" ? " active" : ""}`} onClick={() => goToView("zapi")}>
            <span className="nav-icon">⚡</span> Conectar WhatsApp
          </div>
          {userEmail === ADMIN_EMAIL && (
            <div className={`nav-item${view === "admin" ? " active" : ""}`} onClick={() => goToView("admin")}>
              <span className="nav-icon">👑</span> Painel da dona
            </div>
          )}
        </div>
        <div className="nav-footer">
          <span style={{ fontSize: "11px", color: "var(--muted)", display: "block", marginBottom: "4px" }}>
            {userEmail}
          </span>
          <button className="logout-btn" onClick={onLogout}>Sair</button>
        </div>
      </div>

      <div className={`conversation${!mobileShowMain ? " hide-mobile" : ""}`}>
        {selectedContact ? (
          <React.Fragment>
            <div className="conv-header">
              <div className="conv-header-left">
                <button className="back-btn" onClick={() => setMobileShowMain(false)}>←</button>
                <div className="avatar">{initials(selectedContact.name)}</div>
                <div>
                  <p className="conv-name">{selectedContact.name || selectedContact.phone}</p>
                  <p className="conv-phone">{selectedContact.phone}</p>
                </div>
              </div>
              <div className="header-actions">
                <FieldSelect contact={selectedContact} fb={fb} clientId={clientId} field="handling" placeholder="Condução…"
                  options={Object.entries(HANDLING_LABELS)} />
                <StatusSelect contact={selectedContact} fb={fb} clientId={clientId} />
                <button className="close-btn" title="Voltar ao relatório" onClick={closeConversation}>
                  ✕
                </button>
              </div>
            </div>
            <div className="messages">
              {messages.map((m) => <MessageBubble key={m.id} message={m} />)}
              <div ref={messagesEndRef} />
            </div>
          </React.Fragment>
        ) : view === "report" ? (
          <React.Fragment>
            <div className="main-toolbar">
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <button className="back-btn" style={{ alignSelf: "flex-start" }} onClick={backToMenu}>←</button>
                <button className="add-contact-btn" onClick={() => setShowNewContact(true)}>+ Novo contato</button>
              </div>
              <input
                className="search"
                placeholder="Buscar por nome ou telefone"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
              />
              <div className="filters" style={{ padding: 0, border: "none" }}>
                <div
                  className={`filter-pill${statusFilter === "todos" ? " active" : ""}`}
                  onClick={() => setStatusFilter("todos")}
                >
                  Todos
                </div>
                {funnel.map((st) => (
                  <div
                    key={st.key}
                    className={`filter-pill${statusFilter === st.key ? " active" : ""}`}
                    onClick={() => setStatusFilter(st.key)}
                  >
                    {st.label}
                  </div>
                ))}
              </div>
              {availableYears.length > 0 && (
                <div style={{ display: "flex", gap: 8 }}>
                  <select className="timeline-select" value={yearFilter ?? ""} onChange={handleYearFilterChange}>
                    <option value="">Todos os anos</option>
                    {availableYears.map((y) => <option key={y} value={y}>{y}</option>)}
                  </select>
                  {yearFilter != null && availableMonths.length > 0 && (
                    <select className="timeline-select" value={monthFilter ?? ""} onChange={handleMonthFilterChange}>
                      <option value="">Mês (todos)</option>
                      {availableMonths.map((m) => <option key={m} value={m}>{MONTH_NAMES_LONG[m]}</option>)}
                    </select>
                  )}
                </div>
              )}
            </div>
            <div className="main-body">
              {loading ? (
                <div className="empty-list">Carregando contatos…</div>
              ) : (
                <ReportTable contacts={filteredContacts} onSelect={selectContact} fb={fb} clientId={clientId} />
              )}
            </div>
          </React.Fragment>
        ) : view === "overview" ? (
          <React.Fragment>
            <div className="main-toolbar" style={{ flexDirection: "row", alignItems: "center" }}>
              <button className="back-btn" onClick={backToMenu}>←</button>
              <span style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: "16px" }}>Visão geral</span>
              {yearFilter != null && (
                <span style={{ fontSize: "12px", color: "var(--muted)" }}>
                  · filtrado por {monthFilter != null ? `${MONTH_NAMES_LONG[monthFilter]}/${yearFilter}` : yearFilter}
                </span>
              )}
            </div>
            <div className="main-body">
              <Overview contacts={dateFilteredContacts} fb={fb} clientId={clientId} />
            </div>
          </React.Fragment>
        ) : view === "funnel" ? (
          <React.Fragment>
            <div className="main-toolbar" style={{ flexDirection: "row", alignItems: "center" }}>
              <button className="back-btn" onClick={backToMenu}>←</button>
              <span style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: "16px" }}>Meu funil</span>
            </div>
            <div className="main-body">
              <FunnelEditor key={JSON.stringify(config.funnel) + JSON.stringify(config.offers)} fb={fb} clientId={clientId} config={config} />
            </div>
          </React.Fragment>
        ) : view === "zapi" ? (
          <React.Fragment>
            <div className="main-toolbar" style={{ flexDirection: "row", alignItems: "center" }}>
              <button className="back-btn" onClick={backToMenu}>←</button>
              <span style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: "16px" }}>Conectar WhatsApp</span>
            </div>
            <div className="main-body">
              <ZapiConnect fb={fb} />
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div className="main-toolbar" style={{ flexDirection: "row", alignItems: "center" }}>
              <button className="back-btn" onClick={backToMenu}>←</button>
            </div>
            <div className="main-body">
              <AdminPanel fb={fb} />
            </div>
          </React.Fragment>
        )}
      </div>
      {showNewContact && (
        <NewContactModal
          fb={fb}
          clientId={clientId}
          onClose={() => setShowNewContact(false)}
          onSaved={() => setShowNewContact(false)}
        />
      )}
    </div>
    </FunnelContext.Provider>
  );
}

function Login({ fb }) {
  const [mode, setMode] = useState("login"); // 'login' | 'signup' | 'reset'
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [loading, setLoading] = useState(false);

  function handleSubmit(e) {
    e.preventDefault();
    if (!fb) return;
    setError("");
    setInfo("");
    setLoading(true);

    if (mode === "reset") {
      fb.sendPasswordResetEmail(fb.auth, email)
        .then(() => setInfo("Te mandamos um e-mail com o link pra criar uma senha nova. Confere também a caixa de spam."))
        .catch((err) => {
          console.error("Erro ao enviar e-mail de redefinição:", err);
          if (err.code === "auth/invalid-email") setError("E-mail inválido.");
          else if (err.code === "auth/user-not-found") setError("E-mail não encontrado.");
          else setError("Não consegui enviar o e-mail. Confere se digitou certo.");
        })
        .finally(() => setLoading(false));
      return;
    }

    const action =
      mode === "signup"
        ? fb.createUserWithEmailAndPassword(fb.auth, email, password)
        : fb.signInWithEmailAndPassword(fb.auth, email, password);

    action
      .catch((err) => {
        console.error("Erro de autenticação:", err);
        if (err.code === "auth/email-already-in-use") {
          setError("Esse e-mail já tem conta. Tenta entrar em vez de cadastrar.");
        } else if (err.code === "auth/weak-password") {
          setError("A senha precisa ter pelo menos 6 caracteres.");
        } else if (err.code === "auth/invalid-email") {
          setError("E-mail inválido.");
        } else if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
          setError("E-mail ou senha incorretos.");
        } else {
          setError(mode === "signup" ? "Não consegui criar sua conta." : "E-mail ou senha incorretos.");
        }
      })
      .finally(() => setLoading(false));
  }

  return (
    <div className="login-screen">
      <form className="login-card" onSubmit={handleSubmit}>
        <p className="login-brand">Trilha</p>
        <p className="login-sub">
          {mode === "signup" ? "Cria sua conta pra começar" : mode === "reset" ? "Recupera o acesso à sua conta" : "Entre pra ver suas conversas do WhatsApp"}
        </p>
        <div className="login-field">
          <label className="login-label">E-mail</label>
          <input
            className="login-input"
            type="email"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            required
            autoFocus
          />
        </div>
        {mode !== "reset" && (
          <div className="login-field">
            <label className="login-label">Senha</label>
            <input
              className="login-input"
              type="password"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              required
              minLength={6}
            />
          </div>
        )}
        <button className="login-btn" type="submit" disabled={loading}>
          {loading ? "Aguarda…" : mode === "signup" ? "Criar conta" : mode === "reset" ? "Enviar link de redefinição" : "Entrar"}
        </button>
        {error && <p className="login-error">{error}</p>}
        {info && <p style={{ fontSize: "12px", color: "var(--primary)", textAlign: "center", marginTop: "10px" }}>{info}</p>}

        {mode === "login" && (
          <p style={{ textAlign: "center", fontSize: "12px", marginTop: "10px" }}>
            <span className="logout-btn" onClick={() => { setMode("reset"); setError(""); setInfo(""); }}>Esqueci minha senha</span>
          </p>
        )}

        <p style={{ textAlign: "center", fontSize: "12px", color: "var(--muted)", marginTop: "16px" }}>
          {mode === "signup" ? (
            <React.Fragment>
              Já tem conta?{" "}
              <span className="logout-btn" onClick={() => { setMode("login"); setError(""); setInfo(""); }}>Entrar</span>
            </React.Fragment>
          ) : mode === "reset" ? (
            <React.Fragment>
              Lembrou a senha?{" "}
              <span className="logout-btn" onClick={() => { setMode("login"); setError(""); setInfo(""); }}>Entrar</span>
            </React.Fragment>
          ) : (
            <React.Fragment>
              Ainda não tem conta?{" "}
              <span className="logout-btn" onClick={() => { setMode("signup"); setError(""); setInfo(""); }}>Criar conta</span>
            </React.Fragment>
          )}
        </p>
      </form>
    </div>
  );
}

function App() {
  const [fb, setFb] = useState(window.__wcrmFirebase || null);
  const [user, setUser] = useState(undefined); // undefined = ainda não sabemos; null = deslogado

  useEffect(() => {
    if (fb) return;
    function onReady() { setFb(window.__wcrmFirebase); }
    window.addEventListener("wcrm-firebase-ready", onReady);
    return () => window.removeEventListener("wcrm-firebase-ready", onReady);
  }, [fb]);

  useEffect(() => {
    if (!fb) return;
    const unsub = fb.onAuthStateChanged(fb.auth, (u) => setUser(u || null));
    return () => unsub();
  }, [fb]);

  // Garante que o e-mail está salvo no próprio documento do cliente —
  // usado pelo Painel da dona pra listar quem é quem.
  useEffect(() => {
    if (!fb || !user) return;
    const { db, collection, doc, setDoc } = fb;
    const clientRef = doc(collection(db, "clients"), user.uid);
    setDoc(clientRef, { email: (user.email || "").toLowerCase() }, { merge: true }).catch((err) =>
      console.error("Erro ao salvar e-mail do cliente:", err)
    );
  }, [fb, user]);

  function handleLogout() {
    if (fb) fb.signOut(fb.auth);
  }

  if (!fb || user === undefined) {
    return <div className="login-screen"><p style={{ color: "var(--muted)", fontFamily: "IBM Plex Sans, sans-serif" }}>Carregando…</p></div>;
  }

  if (!user) {
    return <Login fb={fb} />;
  }

  return (
    <Dashboard fb={fb} clientId={user.uid} userEmail={user.email} onLogout={handleLogout} />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
